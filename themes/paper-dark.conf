# Paper Dark for keepane: keepane's own look since 0.38 (`set -g theme
# paper-dark`), written out (a test keeps it the same as the built-in one),
# to copy and change. Loaded from ~/.keepane.conf:
#   source-file ~/.keepane/themes/paper-dark.conf
#
# Ink on dark paper, as the code on dfine.tech is printed at night: the
# panes in Vitesse Dark's colours on a warm near-black, a quiet bar, and one
# accent, cinnabar, for the session and the current window.
#
# Palette: bg #171716  bar #121212  line #666664  muted #87837b  soft #a5a29a
#          fg #cecabe  cinnabar #dd625e
# Vitesse Dark's colours (its text at the 0.93 it is drawn in), the six
# hues with more colour in them (their OKLCH chroma raised by about a
# third, the lightness kept), and bright black lifted from #777777 (4.0:1)
# to #818181, so every text colour reads at 4.5:1 or more on the panes and
# the bar (WCAG AA; the lines at 3:1).

# Status line: a bar a shade darker than the panes, in soft ink.
# The colours, each named once; the lines below use them as #{@name}.
set -g @paper "#171716"
set -g @ink "#cecabe"
set -g @bar "#121212"
set -g @soft "#a5a29a"
set -g @muted "#87837b"
set -g @line "#666664"
set -g @accent "#dd625e"
set -g @warn "#dd625e"
set -g status-style "fg=#{@soft},bg=#{@bar}"

# Panes: drawn on the dark paper whatever the terminal's own colours are,
# the default text and background and the 16 colours programs use (black,
# red, green, yellow, blue, magenta, cyan, white, then their bright ones).
set -g window-style "fg=#{@ink},bg=#{@paper}"
set -g pane-colours "#393a34 #dc696c #2b9870 #efca4b #4f95cf #ec60a1 #38aebe #dbd7ca #818181 #dc696c #2b9870 #efca4b #4f95cf #ec60a1 #38aebe #ffffff"

# Pane borders: quiet lines, the active pane outlined in cinnabar.
set -g pane-border-style "fg=#{@line}"
set -g pane-active-border-style "fg=#{@accent}"

# Left: the session name on a cinnabar block, the one block on the bar.
set -g status-left-length 40
set -g status-left "#[fg=#{@bar},bg=#{@accent},bold] #S #[default] #{?pane_passthrough,#[fg=#{@accent},bold]passthrough#[default] ,}"

# Windows: muted tabs, the current one in cinnabar, underlined.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@muted}] #I:#W#F "
set -g window-status-current-format "#[fg=#{@accent},bold] #[underscore]#I:#W#F#[nounderscore] #[default]"

# Right: a newer keepane when there is one (in cinnabar), the web page's
# viewers, the work mode (in cinnabar when not normal), the git branch, the
# directory, CPU / MEM, the battery when there is one, then the clock.
# On a client narrower than 120 columns CPU / MEM / battery are left out,
# under 100 the directory too; the work mode shows only when not normal.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#{@accent},bold]⇡ #{keepane_update}#[default]  ,}#{?web_url,#[fg=#{@ink}]web #{web_clients}#[default]  ,}#{?#{==:#{pane_work_mode},normal},,#[fg=#{@accent},bold]#{pane_work_mode}#[default]  }#{?git_branch,#[fg=#{@ink}]#{git_branch}#{?git_marks, #{git_marks},}  ,}#[fg=#{@muted}]#{?#{&&:#{client_width},#{<:#{client_width},100}},,#{pane_current_path_short}  }#{?#{&&:#{client_width},#{<:#{client_width},120}},,CPU #{cpu_percentage}  MEM #{ram_percentage}  #{?battery_percentage,BAT #{battery_percentage}  ,}}#[fg=#{@ink},bold]%H:%M "
