# Paper Dark for keepane: keepane's own look since 0.38 (`set -g theme
# paper-dark`), written out (a test keeps it the same as the built-in one),
# to copy and change. Loaded from ~/.keepane.conf:
#   source-file ~/.keepane/themes/paper-dark.conf
#
# Ink on dark paper, as the code on dfine.tech is printed at night: the
# panes in Vitesse Dark's colours on a warm near-black, a quiet bar, and one
# accent, cinnabar, for the session and the current window.
#
# Palette: bg #171716  bar #121212  line #666664  muted #87837b  soft #a5a29a
#          fg #cecabe  cinnabar #dd625e
# Vitesse Dark's colours as they come (its text at the 0.93 it is drawn in),
# but bright black, lifted from #777777 (4.0:1) to #818181, so every text
# colour reads at 4.5:1 or more on the panes and the bar (WCAG AA; the
# lines at 3:1).

# Status line: a bar a shade darker than the panes, in soft ink.
set -g status-style "fg=#a5a29a,bg=#121212"

# Panes: drawn on the dark paper whatever the terminal's own colours are,
# the default text and background and the 16 colours programs use (black,
# red, green, yellow, blue, magenta, cyan, white, then their bright ones).
set -g window-style "fg=#cecabe,bg=#171716"
set -g pane-colours "#393a34 #cb7676 #4d9375 #e6cc77 #6394bf #d9739f #5eaab5 #dbd7ca #818181 #cb7676 #4d9375 #e6cc77 #6394bf #d9739f #5eaab5 #ffffff"

# Pane borders: quiet lines, the active pane outlined in cinnabar.
set -g pane-border-style "fg=#666664"
set -g pane-active-border-style "fg=#dd625e"

# Left: the session name on a cinnabar block, the one block on the bar.
set -g status-left-length 40
set -g status-left "#[fg=#121212,bg=#dd625e,bold] #S #[default] #{?pane_passthrough,#[fg=#dd625e,bold]passthrough#[default] ,}"

# Windows: muted tabs, the current one in cinnabar, underlined.
set -g window-status-separator ""
set -g window-status-format "#[fg=#87837b] #I:#W#F "
set -g window-status-current-format "#[fg=#dd625e,bold] #[underscore]#I:#W#F#[nounderscore] #[default]"

# Right: a newer keepane when there is one (in cinnabar), the web page's
# viewers, the work mode (in cinnabar when not normal), the git branch, the
# directory, CPU / MEM, the battery when there is one, then the clock.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#dd625e,bold]⇡ #{keepane_update}#[default]  ,}#{?web_url,#[fg=#cecabe]web #{web_clients}#[default]  ,}#{?#{==:#{pane_work_mode},normal},#[fg=#87837b]normal  ,#[fg=#dd625e,bold]#{pane_work_mode}#[default]  }#{?git_branch,#[fg=#cecabe]#{git_branch}#{?git_marks, #{git_marks},}  ,}#[fg=#87837b]#{pane_current_path_short}  CPU #{cpu_percentage}  MEM #{ram_percentage}  #{?battery_percentage,BAT #{battery_percentage}  ,}#[fg=#cecabe,bold]%H:%M "
