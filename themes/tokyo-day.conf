# Tokyo Night Day for keepane: the light one of the Tokyo Night family
# (`set -g theme tokyo-day`). It sets the same options as tokyo-night.conf,
# so the two replace each other whole. Loaded as a file it works the same:
#   source-file ~/.keepane/themes/tokyo-day.conf
#
# Palette: bg #e1e2e7  bar #d0d5e3  line #7b8095  muted #565b76  fg #3358b0
#          blue #225baa  purple #7440b8  cyan #006486  green #4b6431  yellow #725833
# Tokyo Night Day's colours darkened, each in its own hue, until its text
# reads at 4.5:1 or more on the bar and the panes (WCAG AA; the lines at
# 3:1): as they come, 29 of the 32 pairs drawn here fell short, down to
# 1.7:1.

# Status line: a bar a shade darker than the panes' background.
set -g status-style "fg=#3358b0,bg=#d0d5e3"

# Panes: drawn light whatever the terminal's own colours are, the default
# text and background and the 16 colours programs use (black, red, green,
# yellow, blue, magenta, cyan, white, then their bright ones).
set -g window-style "fg=#3358b0,bg=#e1e2e7"
set -g pane-colours "#e9e9ed #b21e49 #4b6431 #725833 #225baa #7440b8 #006486 #4d5a8b #595c6d #b21e49 #4b6431 #725833 #225baa #7440b8 #006486 #3358b0"

# Pane borders: quiet lines, the active pane outlined in blue.
set -g pane-border-style "fg=#7b8095"
set -g pane-active-border-style "fg=#225baa"

# Left: the session name on a blue block.
set -g status-left-length 40
set -g status-left "#[fg=#e1e2e7,bg=#225baa,bold] #S #[default] "

# Windows: muted tabs, the current one on a purple block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#565b76] #I:#W#F "
set -g window-status-current-format "#[fg=#e1e2e7,bg=#7440b8,bold] #I:#W#F #[default]"

# Right: as in tokyo-night, in the day colours.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#e1e2e7,bg=#725833,bold] ⇡ #{keepane_update} #[default] ,}#{?web_url,#[fg=#e1e2e7,bg=#4b6431,bold] web #{web_clients} #[default] ,}#{?#{==:#{pane_work_mode},normal},#[fg=#565b76]normal ,#[fg=#e1e2e7,bg=#7440b8,bold] #{pane_work_mode} #[default] }#{?git_branch,#[fg=#7440b8]#{git_branch} ,}#[fg=#006486]#{pane_current_path_short} #[fg=#4b6431]CPU #{cpu_percentage} #[fg=#725833]MEM #{ram_percentage} #{?battery_percentage,#[fg=#4b6431]BAT #{battery_percentage} ,}#[fg=#e1e2e7,bg=#225baa,bold] %H:%M "
