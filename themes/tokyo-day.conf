# Tokyo Night Day for keepane: the light one of the Tokyo Night family
# (`set -g theme tokyo-day`). It sets the same options as tokyo-night.conf,
# so the two replace each other whole. Loaded as a file it works the same:
#   source-file ~/.keepane/themes/tokyo-day.conf
#
# Palette: bg #e1e2e7  bar #d0d5e3  line #a8aecb  muted #848cb5  fg #3760bf
#          blue #2e7de9  purple #9854f1  cyan #007197  green #587539  yellow #8c6c3e

# Status line: a bar a shade darker than the panes' background.
set -g status-style "fg=#3760bf,bg=#d0d5e3"

# Panes: drawn light whatever the terminal's own colours are, the default
# text and background and the 16 colours programs use (black, red, green,
# yellow, blue, magenta, cyan, white, then their bright ones).
set -g window-style "fg=#3760bf,bg=#e1e2e7"
set -g pane-colours "#e9e9ed #f52a65 #587539 #8c6c3e #2e7de9 #9854f1 #007197 #6172b0 #a1a6c5 #f52a65 #587539 #8c6c3e #2e7de9 #9854f1 #007197 #3760bf"

# Pane borders: quiet lines, the active pane outlined in blue.
set -g pane-border-style "fg=#a8aecb"
set -g pane-active-border-style "fg=#2e7de9"

# Left: the session name on a blue block.
set -g status-left-length 40
set -g status-left "#[fg=#e1e2e7,bg=#2e7de9,bold] #S #[default] "

# Windows: muted tabs, the current one on a purple block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#848cb5] #I:#W#F "
set -g window-status-current-format "#[fg=#e1e2e7,bg=#9854f1,bold] #I:#W#F #[default]"

# Right: as in tokyo-night, in the day colours.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#e1e2e7,bg=#8c6c3e,bold] ⇡ #{keepane_update} #[default] ,}#{?web_url,#[fg=#e1e2e7,bg=#587539,bold] web #{web_clients} #[default] ,}#{?#{==:#{pane_work_mode},normal},#[fg=#848cb5]normal ,#[fg=#e1e2e7,bg=#9854f1,bold] #{pane_work_mode} #[default] }#{?git_branch,#[fg=#9854f1]#{git_branch} ,}#[fg=#007197]#{pane_current_path_short} #[fg=#587539]CPU #{cpu_percentage} #[fg=#8c6c3e]MEM #{ram_percentage} #{?battery_percentage,#[fg=#587539]BAT #{battery_percentage} ,}#[fg=#e1e2e7,bg=#2e7de9,bold] %H:%M "
