# Tokyo Night Day for keepane: the light one of the Tokyo Night family
# (`set -g theme tokyo-day`). It sets the same options as tokyo-night.conf,
# so the two replace each other whole. Loaded as a file it works the same:
#   source-file ~/.keepane/themes/tokyo-day.conf
#
# Palette: bg #e1e2e7  bar #d0d5e3  line #7b8095  muted #565b76  fg #3358b0
#          blue #225baa  purple #7440b8  cyan #006486  green #4b6431  yellow #725833
# Tokyo Night Day's colours darkened, each in its own hue, until its text
# reads at 4.5:1 or more on the bar and the panes (WCAG AA; the lines at
# 3:1): as they come, 29 of the 32 pairs drawn here fell short, down to
# 1.7:1.

# Status line: a bar a shade darker than the panes' background.
# The colours, each named once; the lines below use them as #{@name}.
set -g @paper "#e1e2e7"
set -g @ink "#3358b0"
set -g @bar "#d0d5e3"
set -g @soft "#3358b0"
set -g @muted "#565b76"
set -g @line "#7b8095"
set -g @accent "#225baa"
set -g @warn "#725833"
set -g @pick "#d2d7e2"
set -g status-style "fg=#{@soft},bg=#{@bar}"

# Panes: drawn light whatever the terminal's own colours are, the default
# text and background and the 16 colours programs use (black, red, green,
# yellow, blue, magenta, cyan, white, then their bright ones).
set -g window-style "fg=#{@ink},bg=#{@paper}"
set -g pane-colours "#e9e9ed #b21e49 #4b6431 #725833 #225baa #7440b8 #006486 #4d5a8b #595c6d #b21e49 #4b6431 #725833 #225baa #7440b8 #006486 #3358b0"

# Pane borders: quiet lines, the active pane outlined in blue.
set -g pane-border-style "fg=#{@line}"
set -g pane-active-border-style "fg=#{@accent}"

# The picked line in keepane's lists and boards: ink on a tint of the accent.
set -g mode-style "fg=#{@ink},bg=#{@pick},bold"

# Left: the session name on a blue block.
set -g status-left-length 40
set -g status-left "#[fg=#{@paper},bg=#{@accent},bold] #S #[default] #{?pane_passthrough,#[fg=#{@accent},bold]passthrough#[default] ,}"

# Windows: muted tabs, the current one on a purple block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@muted}] #I:#W#F "
set -g window-status-current-format "#[fg=#{@paper},bg=#7440b8,bold] #I:#W#F #[default]"

# Right: as in tokyo-night, in the day colours.
# On a client narrower than 120 columns CPU / MEM / battery are left out,
# under 100 the directory too; the work mode shows only when not normal.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#{@paper},bg=#{@warn},bold] ⇡ #{keepane_update} #[default] ,}#{?web_url,#[fg=#{@paper},bg=#4b6431,bold] web #{web_clients} #[default] ,}#{?#{==:#{pane_work_mode},normal},,#[fg=#{@paper},bg=#7440b8,bold] #{pane_work_mode} #[default] }#{?git_branch,#[fg=#7440b8]#{git_branch}#{?git_marks, #{git_marks},} ,}#{?#{&&:#{client_width},#{<:#{client_width},100}},,#[fg=#006486]#{pane_current_path_short} }#{?#{&&:#{client_width},#{<:#{client_width},120}},,#[fg=#4b6431]CPU #{cpu_percentage} #[fg=#{@warn}]MEM #{ram_percentage} #{?battery_percentage,#[fg=#4b6431]BAT #{battery_percentage} ,}}#[fg=#{@paper},bg=#{@accent},bold] %H:%M "
