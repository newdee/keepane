# Nord for keepane (an arctic, north-bluish palette), built in
# (`set -g theme nord`) and written out here to copy and change. Loaded
# from ~/.keepane.conf it works the same:
#   source-file ~/.keepane/themes/nord.conf
#
# Palette: bg #2e3440  bar #242933  line #727d92  muted #909cb2  fg #d8dee9
#          accent #88c0d0  purple #b690af  cyan #88c0d0  green #a3be8c  yellow #ebcb8b
# Drawn on its own background whatever the terminal's colours are, like
# every built-in theme, and every text colour reads at 4.5:1 or more on the
# panes and the bar (WCAG AA; the lines at 3:1). Where the palette's own
# colour fell short only its lightness was moved, its hue kept:
#   colours 1, 5, 8, 9, 13; the border; muted.

# Status line: a bar a shade darker than the panes.
set -g status-style "fg=#d8dee9,bg=#242933"

# Panes: the default text and background and the 16 colours programs use
# (black, red, green, yellow, blue, magenta, cyan, white, then the bright ones).
set -g window-style "fg=#d8dee9,bg=#2e3440"
set -g pane-colours "#3b4252 #e17f87 #a3be8c #ebcb8b #81a1c1 #b690af #88c0d0 #e5e9f0 #909cb2 #e17f87 #a3be8c #ebcb8b #81a1c1 #b690af #8fbcbb #eceff4"

# Pane borders: quiet lines, the active pane outlined in the accent.
set -g pane-border-style "fg=#727d92"
set -g pane-active-border-style "fg=#88c0d0"

# Left: the session name on an accent block.
set -g status-left-length 40
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] #S #[default] #{?pane_passthrough,#[fg=#88c0d0,bold]passthrough#[default] ,}"

# Windows: muted tabs, the current one on a purple block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#909cb2] #I:#W#F "
set -g window-status-current-format "#[fg=#2e3440,bg=#b690af,bold] #I:#W#F #[default]"

# Right: a newer keepane when there is one, the phones' page, the work mode
# when not normal, the git branch, the directory, CPU / MEM, the battery
# when there is one, then the clock on an accent block.
# On a client narrower than 120 columns CPU / MEM / battery are left out,
# under 100 the directory too; the work mode shows only when not normal.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#2e3440,bg=#ebcb8b,bold] ⇡ #{keepane_update} #[default] ,}#{?web_url,#[fg=#2e3440,bg=#a3be8c,bold] web #{web_clients} #[default] ,}#{?#{==:#{pane_work_mode},normal},,#[fg=#2e3440,bg=#b690af,bold] #{pane_work_mode} #[default] }#{?git_branch,#[fg=#b690af]#{git_branch}#{?git_marks, #{git_marks},} ,}#{?#{&&:#{client_width},#{<:#{client_width},100}},,#[fg=#88c0d0]#{pane_current_path_short} }#{?#{&&:#{client_width},#{<:#{client_width},120}},,#[fg=#a3be8c]CPU #{cpu_percentage} #[fg=#ebcb8b]MEM #{ram_percentage} #{?battery_percentage,#[fg=#a3be8c]BAT #{battery_percentage} ,}}#[fg=#2e3440,bg=#88c0d0,bold] %H:%M "