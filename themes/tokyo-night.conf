# Tokyo Night for keepane: keepane's own look since 0.18, written out (a
# test keeps it the same as the built-in one), to copy and change. Loaded
# from ~/.keepane.conf:
#   source-file ~/.keepane/themes/tokyo-night.conf
#
# Palette: bg #1a1b26  line #3b4261  muted #565f89  fg #a9b1d6
#          blue #7aa2f7  purple #bb9af7  cyan #7dcfff  green #9ece6a  yellow #e0af68

# Status line: a bar a shade darker than the terminal's Tokyo Night
# background (#1a1b26), so it reads as its own strip.
set -g status-style "fg=#a9b1d6,bg=#16161e"

# Panes: in the terminal's own colours, its background and its palette (a
# terminal set to Tokyo Night shows them as this theme means them).
set -g window-style "default"
set -g pane-colours ""

# Pane borders: quiet lines, the active pane outlined in blue.
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Left: the session name on a blue block.
set -g status-left-length 40
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default] "

# Windows: muted tabs, the current one on a purple block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#565f89] #I:#W#F "
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W#F #[default]"

# Right: a newer keepane when there is one, the git branch, the directory,
# CPU / MEM, the battery when there is one, then the clock on a blue block.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#1a1b26,bg=#e0af68,bold] ⇡ #{keepane_update} #[default] ,}#{?web_url,#[fg=#1a1b26,bg=#9ece6a,bold] web #{web_clients} #[default] ,}#{?#{==:#{pane_work_mode},normal},#[fg=#565f89]normal ,#[fg=#1a1b26,bg=#bb9af7,bold] #{pane_work_mode} #[default] }#{?git_branch,#[fg=#bb9af7]#{git_branch} ,}#[fg=#7dcfff]#{pane_current_path_short} #[fg=#9ece6a]CPU #{cpu_percentage} #[fg=#e0af68]MEM #{ram_percentage} #{?battery_percentage,#[fg=#9ece6a]BAT #{battery_percentage} ,}#[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M "
