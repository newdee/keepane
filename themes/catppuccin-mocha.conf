# Catppuccin Mocha for keepane (the darkest of the Catppuccin flavours), built in
# (`set -g theme catppuccin-mocha`) and written out here to copy and change. Loaded
# from ~/.keepane.conf it works the same:
#   source-file ~/.keepane/themes/catppuccin-mocha.conf
#
# Palette: bg #1e1e2e  bar #181825  line #65697e  muted #81859c  fg #cdd6f4
#          accent #cba6f7  purple #f5c2e7  cyan #94e2d5  green #a6e3a1  yellow #f9e2af
# Drawn on its own background whatever the terminal's colours are, like
# every built-in theme, and every text colour reads at 4.5:1 or more on the
# panes and the bar (WCAG AA; the lines at 3:1). Where the palette's own
# colour fell short only its lightness was moved, its hue kept:
#   colours 8; the border; muted.

# Status line: a bar a shade darker than the panes.
# The colours, each named once; the lines below use them as #{@name}.
set -g @paper "#1e1e2e"
set -g @ink "#cdd6f4"
set -g @bar "#181825"
set -g @soft "#bac2de"
set -g @muted "#81859c"
set -g @line "#65697e"
set -g @accent "#cba6f7"
set -g @warn "#f9e2af"
set -g @pick "#413956"
set -g status-style "fg=#{@soft},bg=#{@bar}"

# Panes: the default text and background and the 16 colours programs use
# (black, red, green, yellow, blue, magenta, cyan, white, then the bright ones).
set -g window-style "fg=#{@ink},bg=#{@paper}"
set -g pane-colours "#11111b #f38ba8 #a6e3a1 #f9e2af #89b4fa #f5c2e7 #94e2d5 #bac2de #82859c #f38ba8 #a6e3a1 #f9e2af #89b4fa #f5c2e7 #94e2d5 #a6adc8"

# Pane borders: quiet lines, the active pane outlined in the accent.
set -g pane-border-style "fg=#{@line}"
set -g pane-active-border-style "fg=#{@accent}"

# The picked line in keepane's lists and boards: ink on a tint of the accent.
set -g mode-style "fg=#{@ink},bg=#{@pick},bold"

# Left: the session name on an accent block.
set -g status-left-length 40
set -g status-left "#[fg=#{@paper},bg=#{@accent},bold] #S #[default] #{?pane_passthrough,#[fg=#{@accent},bold]passthrough#[default] ,}"

# Windows: muted tabs, the current one on a purple block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@muted}] #I:#W#F "
set -g window-status-current-format "#[fg=#{@paper},bg=#f5c2e7,bold] #I:#W#F #[default]"

# Right: a newer keepane when there is one, the phones' page, the work mode
# when not normal, the git branch, the directory, CPU / MEM, the battery
# when there is one, then the clock on an accent block.
# On a client narrower than 120 columns CPU / MEM / battery are left out,
# under 100 the directory too; the work mode shows only when not normal.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#{@paper},bg=#{@warn},bold] ⇡ #{keepane_update} #[default] ,}#{?web_url,#[fg=#{@paper},bg=#a6e3a1,bold] web #{web_clients} #[default] ,}#{?#{==:#{pane_work_mode},normal},,#[fg=#{@paper},bg=#f5c2e7,bold] #{pane_work_mode} #[default] }#{?git_branch,#[fg=#f5c2e7]#{git_branch}#{?git_marks, #{git_marks},} ,}#{?#{&&:#{client_width},#{<:#{client_width},100}},,#[fg=#94e2d5]#{pane_current_path_short} }#{?#{&&:#{client_width},#{<:#{client_width},120}},,#[fg=#a6e3a1]CPU #{cpu_percentage} #[fg=#{@warn}]MEM #{ram_percentage} #{?battery_percentage,#[fg=#a6e3a1]BAT #{battery_percentage} ,}}#[fg=#{@paper},bg=#{@accent},bold] %H:%M "