# Gruvbox dark. Load it from ~/.keepane.conf:
#   source-file ~/.keepane/themes/gruvbox-dark.conf

set -g status-style "fg=#ebdbb2,bg=#3c3836"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"

set -g status-left "#[fg=#282828,bg=#fabd2f,bold] #S #[default] "
set -g window-status-format "#[fg=#a89984] #I:#W#F "
set -g window-status-current-format "#[fg=#282828,bg=#d79921,bold] #I:#W#F "
set -g status-right "#{?#{==:#{pane_work_mode},normal},#[fg=#928374]normal ,#[fg=#282828,bg=#d3869b,bold] #{pane_work_mode} #[default] }#[fg=#83a598]#{?pane_current_path,#{pane_current_path} ,}#[fg=#ebdbb2]%H:%M "
