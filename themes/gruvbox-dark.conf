# Gruvbox Dark for keepane (retro groove, warm on dark), built in
# (`set -g theme gruvbox-dark`) and written out here to copy and change. Loaded
# from ~/.keepane.conf it works the same:
#   source-file ~/.keepane/themes/gruvbox-dark.conf
#
# Palette: bg #282828  bar #1d2021  line #796f67  muted #9b8c7d  fg #ebdbb2
#          accent #fabd2f  purple #d3869b  cyan #8ec07c  green #b8bb26  yellow #fabd2f
# Drawn on its own background whatever the terminal's colours are, like
# every built-in theme, and every text colour reads at 4.5:1 or more on the
# panes and the bar (WCAG AA; the lines at 3:1). Where the palette's own
# colour fell short only its lightness was moved, its hue kept:
#   colours 1, 8, 9; the border; muted.

# Status line: a bar a shade darker than the panes.
set -g status-style "fg=#d5c4a1,bg=#1d2021"

# Panes: the default text and background and the 16 colours programs use
# (black, red, green, yellow, blue, magenta, cyan, white, then the bright ones).
set -g window-style "fg=#ebdbb2,bg=#282828"
set -g pane-colours "#1d2021 #f95641 #b8bb26 #fabd2f #83a598 #d3869b #8ec07c #d5c4a1 #9b8c7d #f95641 #b8bb26 #fabd2f #83a598 #d3869b #8ec07c #ebdbb2"

# Pane borders: quiet lines, the active pane outlined in the accent.
set -g pane-border-style "fg=#796f67"
set -g pane-active-border-style "fg=#fabd2f"

# Left: the session name on an accent block.
set -g status-left-length 40
set -g status-left "#[fg=#282828,bg=#fabd2f,bold] #S #[default] #{?pane_passthrough,#[fg=#fabd2f,bold]passthrough#[default] ,}"

# Windows: muted tabs, the current one on a purple block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#9b8c7d] #I:#W#F "
set -g window-status-current-format "#[fg=#282828,bg=#d3869b,bold] #I:#W#F #[default]"

# Right: a newer keepane when there is one, the phones' page, the work mode
# when not normal, the git branch, the directory, CPU / MEM, the battery
# when there is one, then the clock on an accent block.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#282828,bg=#fabd2f,bold] ⇡ #{keepane_update} #[default] ,}#{?web_url,#[fg=#282828,bg=#b8bb26,bold] web #{web_clients} #[default] ,}#{?#{==:#{pane_work_mode},normal},#[fg=#9b8c7d]normal ,#[fg=#282828,bg=#d3869b,bold] #{pane_work_mode} #[default] }#{?git_branch,#[fg=#d3869b]#{git_branch}#{?git_marks, #{git_marks},} ,}#[fg=#8ec07c]#{pane_current_path_short} #[fg=#b8bb26]CPU #{cpu_percentage} #[fg=#fabd2f]MEM #{ram_percentage} #{?battery_percentage,#[fg=#b8bb26]BAT #{battery_percentage} ,}#[fg=#282828,bg=#fabd2f,bold] %H:%M "