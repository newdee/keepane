# Terminal for keepane, built in (`set -g theme terminal`): every colour is
# the terminal's own. The panes take its default text and background (so a
# translucent window, a background picture or its own theme show through),
# their programs its 16 colours, and the bar, the borders and the labels
# only its default colours and those 16 by name: change the terminal's theme
# and keepane changes with it. Written out here to copy and change:
#   source-file ~/.keepane/themes/terminal.conf

# The colours, each named once; the lines below use them as #{@name}.
set -g @paper "default"
set -g @ink "default"
set -g @bar "default"
set -g @soft "default"
set -g @muted "brightblack"
set -g @line "brightblack"
set -g @accent "green"
set -g @warn "yellow"
set -g status-style "fg=#{@soft},bg=#{@bar}"
# Panes: in the terminal's own colours, its palette untouched.
set -g window-style "fg=#{@ink},bg=#{@paper}"
set -g pane-colours ""
set -g pane-border-style "fg=#{@line}"
set -g pane-active-border-style "fg=#{@accent}"

set -g status-left-length 40
set -g status-left "#[reverse,bold] #S #[default] #{?pane_passthrough,#[fg=#{@accent},bold]passthrough#[default] ,}"
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@muted}] #I:#W#F "
set -g window-status-current-format "#[fg=#{@accent},bold] #[underscore]#I:#W#F#[nounderscore] #[default]"
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#{@accent},bold]⇡ #{keepane_update}#[default]  ,}#{?web_url,web #{web_clients}  ,}#{?#{==:#{pane_work_mode},normal},,#[fg=#{@accent},bold]#{pane_work_mode}#[default]  }#{?git_branch,#{git_branch}#{?git_marks, #{git_marks},}  ,}#[fg=#{@muted}]#{?#{&&:#{client_width},#{<:#{client_width},100}},,#{pane_current_path_short}  }#{?#{&&:#{client_width},#{<:#{client_width},120}},,CPU #{cpu_percentage}  MEM #{ram_percentage}  #{?battery_percentage,BAT #{battery_percentage}  ,}}#[default,bold]%H:%M "
