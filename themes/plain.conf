# tmux's plain look (keepane's own before 0.18): a green bar, plain labels.
# keepane's default is Tokyo Night; to go back to this, in ~/.keepane.conf:
#   source-file ~/.keepane/themes/plain.conf

set -g status-style "fg=black,bg=green"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"

set -g status-left "[#S] "
set -g window-status-separator " "
set -g window-status-format "#I:#W#F"
set -g window-status-current-format "#I:#W#F"
set -g status-right "#{?git_branch, #{git_branch} |,} #{pane_current_path_short} | CPU #{cpu_percentage} MEM #{ram_percentage}#{?battery_percentage, | BAT #{battery_percentage},} | %H:%M"
