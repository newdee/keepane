# Dracula. Load it from ~/.keepane.conf:
#   source-file ~/.keepane/themes/dracula.conf

set -g status-style "fg=#f8f8f2,bg=#44475a"
set -g pane-border-style "fg=#6272a4"
set -g pane-active-border-style "fg=#bd93f9"

set -g status-left "#[fg=#282a36,bg=#bd93f9,bold] #S #[default] "
set -g window-status-format "#[fg=#6272a4] #I:#W#F "
set -g window-status-current-format "#[fg=#282a36,bg=#50fa7b,bold] #I:#W#F "
set -g status-right "#{?#{==:#{pane_work_mode},normal},#[fg=#6272a4]normal ,#[fg=#282a36,bg=#bd93f9,bold] #{pane_work_mode} #[default] }#[fg=#8be9fd]#{?pane_current_path,#{pane_current_path} ,}#[fg=#f8f8f2]%H:%M "

# Panes: in the terminal's own colours (after tokyo-day, which draws them).
set -g window-style "default"
set -g pane-colours ""
