# Dracula for keepane (the dark theme of many editors), built in
# (`set -g theme dracula`) and written out here to copy and change. Loaded
# from ~/.keepane.conf it works the same:
#   source-file ~/.keepane/themes/dracula.conf
#
# Palette: bg #282a36  bar #21222c  line #6272a4  muted #7f90c4  fg #f8f8f2
#          accent #bd93f9  purple #ff79c6  cyan #8be9fd  green #50fa7b  yellow #f1fa8c
# Drawn on its own background whatever the terminal's colours are, like
# every built-in theme, and every text colour reads at 4.5:1 or more on the
# panes and the bar (WCAG AA; the lines at 3:1). Where the palette's own
# colour fell short only its lightness was moved, its hue kept:
#   colours 8; muted.

# Status line: a bar a shade darker than the panes.
set -g status-style "fg=#f8f8f2,bg=#21222c"

# Panes: the default text and background and the 16 colours programs use
# (black, red, green, yellow, blue, magenta, cyan, white, then the bright ones).
set -g window-style "fg=#f8f8f2,bg=#282a36"
set -g pane-colours "#21222c #ff5555 #50fa7b #f1fa8c #bd93f9 #ff79c6 #8be9fd #f8f8f2 #7f90c4 #ff6e6e #69ff94 #ffffa5 #d6acff #ff92df #a4ffff #ffffff"

# Pane borders: quiet lines, the active pane outlined in the accent.
set -g pane-border-style "fg=#6272a4"
set -g pane-active-border-style "fg=#bd93f9"

# Left: the session name on an accent block.
set -g status-left-length 40
set -g status-left "#[fg=#282a36,bg=#bd93f9,bold] #S #[default] #{?pane_passthrough,#[fg=#bd93f9,bold]passthrough#[default] ,}"

# Windows: muted tabs, the current one on a purple block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#7f90c4] #I:#W#F "
set -g window-status-current-format "#[fg=#282a36,bg=#ff79c6,bold] #I:#W#F #[default]"

# Right: a newer keepane when there is one, the phones' page, the work mode
# when not normal, the git branch, the directory, CPU / MEM, the battery
# when there is one, then the clock on an accent block.
# On a client narrower than 120 columns CPU / MEM / battery are left out,
# under 100 the directory too; the work mode shows only when not normal.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#282a36,bg=#f1fa8c,bold] ⇡ #{keepane_update} #[default] ,}#{?web_url,#[fg=#282a36,bg=#50fa7b,bold] web #{web_clients} #[default] ,}#{?#{==:#{pane_work_mode},normal},,#[fg=#282a36,bg=#ff79c6,bold] #{pane_work_mode} #[default] }#{?git_branch,#[fg=#ff79c6]#{git_branch}#{?git_marks, #{git_marks},} ,}#{?#{&&:#{client_width},#{<:#{client_width},100}},,#[fg=#8be9fd]#{pane_current_path_short} }#{?#{&&:#{client_width},#{<:#{client_width},120}},,#[fg=#50fa7b]CPU #{cpu_percentage} #[fg=#f1fa8c]MEM #{ram_percentage} #{?battery_percentage,#[fg=#50fa7b]BAT #{battery_percentage} ,}}#[fg=#282a36,bg=#bd93f9,bold] %H:%M "