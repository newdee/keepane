# Paper for keepane: the light one of Paper Dark (`set -g theme paper`). It
# sets the same options as paper-dark.conf, so the two replace each other
# whole. Loaded as a file it works the same:
#   source-file ~/.keepane/themes/paper.conf
#
# Ink on sepia paper, an old book's page: the panes in Vitesse Light's hues
# on a warm cream, a bar like the page's darker edge, warm grey inks, and
# one accent, cinnabar, for the session and the current window.
#
# Palette: bg #f0e7d2  bar #e3d8bf  line #8a8172  muted #635b4e  soft #5a5346
#          fg #33302a  cinnabar #a53736
# Vitesse Light's hues with more colour in them (their OKLCH chroma raised
# by up to half, as far as sRGB goes; yellow turned from olive to ochre),
# each then darkened in its own hue only as far as needed to read at 4.5:1
# or more on the bar and the panes (WCAG AA; the lines at 3:1). White and
# bright white are ink, so that text a program draws white still reads;
# bright black is the page's faint ink. Black stays light, for what is
# drawn on colour.

# Status line: a bar a shade darker than the panes, in soft ink.
set -g status-style "fg=#5a5346,bg=#e3d8bf"

# Panes: drawn on the sepia paper whatever the terminal's own colours are,
# the default text and background and the 16 colours programs use (black,
# red, green, yellow, blue, magenta, cyan, white, then their bright ones).
set -g window-style "fg=#33302a,bg=#f0e7d2"
set -g pane-colours "#e3d8bf #a6363d #046641 #815501 #035fa0 #b50165 #036470 #5a5346 #5e584d #a6363d #046641 #815501 #035fa0 #b50165 #036470 #33302a"

# Pane borders: quiet lines, the active pane outlined in cinnabar.
set -g pane-border-style "fg=#8a8172"
set -g pane-active-border-style "fg=#a53736"

# Left: the session name on a cinnabar block, the one block on the bar.
set -g status-left-length 40
set -g status-left "#[fg=#f0e7d2,bg=#a53736,bold] #S #[default] #{?pane_passthrough,#[fg=#a53736,bold]passthrough#[default] ,}"

# Windows: muted tabs, the current one in cinnabar, underlined.
set -g window-status-separator ""
set -g window-status-format "#[fg=#635b4e] #I:#W#F "
set -g window-status-current-format "#[fg=#a53736,bold] #[underscore]#I:#W#F#[nounderscore] #[default]"

# Right: as in paper-dark, in the day colours.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#a53736,bold]⇡ #{keepane_update}#[default]  ,}#{?web_url,#[fg=#33302a]web #{web_clients}#[default]  ,}#{?#{==:#{pane_work_mode},normal},#[fg=#635b4e]normal  ,#[fg=#a53736,bold]#{pane_work_mode}#[default]  }#{?git_branch,#[fg=#33302a]#{git_branch}#{?git_marks, #{git_marks},}  ,}#[fg=#635b4e]#{pane_current_path_short}  CPU #{cpu_percentage}  MEM #{ram_percentage}  #{?battery_percentage,BAT #{battery_percentage}  ,}#[fg=#33302a,bold]%H:%M "
