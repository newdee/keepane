# Paper for keepane: the light one of Paper Dark (`set -g theme paper`). It
# sets the same options as paper-dark.conf, so the two replace each other
# whole. Loaded as a file it works the same:
#   source-file ~/.keepane/themes/paper.conf
#
# Ink on white paper, as the code on dfine.tech is printed by day: the panes
# in Vitesse Light's colours on the page's white, a bar like the rail above
# a code block, and one accent, cinnabar, for the session and the current
# window.
#
# Palette: bg #fdfdfb  bar #eceae4  line #92908a  muted #6b6860  soft #5d5b55
#          fg #393a34  cinnabar #b83e3c
# Vitesse Light's colours darkened, each in its own hue, until its text
# reads at 4.5:1 or more on the bar and the panes (WCAG AA; the lines at
# 3:1): as they come, yellow (#bda437) read at 2.0:1, cyan (#2993a3) at
# 3.0:1, red (#ab5959) at 4.1:1 and the cinnabar (#c3423f) at 4.2:1 on the
# bar. White and bright white are ink, so that text a program draws white
# still reads; bright black is the page's faint ink (#97948c, 2.5:1)
# darkened the same way. Black stays light, for what is drawn on colour.

# Status line: a bar a shade darker than the panes, in soft ink.
set -g status-style "fg=#5d5b55,bg=#eceae4"

# Panes: drawn on the white paper whatever the terminal's own colours are,
# the default text and background and the 16 colours programs use (black,
# red, green, yellow, blue, magenta, cyan, white, then their bright ones).
set -g window-style "fg=#393a34,bg=#fdfdfb"
set -g pane-colours "#eceae4 #9e5252 #1e754f #776723 #296aa3 #a13865 #20727e #5d5b55 #6a6863 #9e5252 #1e754f #776723 #296aa3 #a13865 #20727e #393a34"

# Pane borders: quiet lines, the active pane outlined in cinnabar.
set -g pane-border-style "fg=#92908a"
set -g pane-active-border-style "fg=#b83e3c"

# Left: the session name on a cinnabar block, the one block on the bar.
set -g status-left-length 40
set -g status-left "#[fg=#fdfdfb,bg=#b83e3c,bold] #S #[default] #{?pane_passthrough,#[fg=#b83e3c,bold]passthrough#[default] ,}"

# Windows: muted tabs, the current one in cinnabar, underlined.
set -g window-status-separator ""
set -g window-status-format "#[fg=#6b6860] #I:#W#F "
set -g window-status-current-format "#[fg=#b83e3c,bold] #[underscore]#I:#W#F#[nounderscore] #[default]"

# Right: as in paper-dark, in the day colours.
set -g status-right-length 100
set -g status-right "#{?keepane_update,#[fg=#b83e3c,bold]⇡ #{keepane_update}#[default]  ,}#{?web_url,#[fg=#393a34]web #{web_clients}#[default]  ,}#{?#{==:#{pane_work_mode},normal},#[fg=#6b6860]normal  ,#[fg=#b83e3c,bold]#{pane_work_mode}#[default]  }#{?git_branch,#[fg=#393a34]#{git_branch}#{?git_marks, #{git_marks},}  ,}#[fg=#6b6860]#{pane_current_path_short}  CPU #{cpu_percentage}  MEM #{ram_percentage}  #{?battery_percentage,BAT #{battery_percentage}  ,}#[fg=#393a34,bold]%H:%M "
