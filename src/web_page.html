<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16161e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>keepane</title>
<style>
  :root {
    --bg: #1a1b26; --bar: #16161e; --card: #24283b; --line: #3b4261;
    --fg: #c0caf5; --muted: #565f89; --accent: #7aa2f7; --green: #9ece6a; --red: #f7768e; --yellow: #e0af68;
    --vh: 100dvh;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: var(--vh); display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px; background: var(--bar);
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; border-bottom: 1px solid var(--line);
  }
  header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sub { color: var(--muted); font-weight: 400; }
  button {
    font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer;
  }
  button:active { background: var(--line); }
  /* No double-tap zoom and no tap delay: a tap is taken as one, at once. */
  button, textarea, input { touch-action: manipulation; }
  .icon { width: 36px; padding: 0; font-size: 20px; line-height: 1; }
  main { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
  .hidden { display: none !important; }

  /* The list: each session, its windows, their panes */
  .group { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .group .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session { margin: 14px 12px 2px; color: var(--accent); font-size: 14px; font-weight: 600; }
  .window { margin: 6px 12px 0 22px; color: var(--muted); font-size: 13px; }
  .window.current { color: var(--fg); }
  .group[data-fold] { cursor: pointer; min-height: 34px; user-select: none; }
  .chev { width: 14px; flex: none; color: var(--muted); font-size: 12px; }
  .count { flex: none; color: var(--muted); font-size: 12px; font-weight: 400; }
  .rename { min-height: 28px; width: 32px; padding: 0; font-size: 14px; color: var(--muted); background: transparent; border-color: transparent; flex: none; }
  .pane {
    display: flex; align-items: center; gap: 10px; margin: 6px 12px 6px 22px; padding: 10px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; width: calc(100% - 34px); text-align: left;
  }
  .pane .cmd, .pane .where { overflow-wrap: anywhere; }
  .pane .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .pane.current .dot { background: var(--green); }
  .pane.dead .dot { background: var(--red); }
  .pane .what { flex: 1; min-width: 0; }
  .pane .cmd { font-weight: 600; }
  /* The window's alerts, the marks the status line shows: # printed, ! bell, ~ silent. */
  .pane.alert { border-color: var(--yellow); }
  .marks { display: flex; gap: 4px; flex: none; }
  .mark { font: 600 13px ui-monospace, Menlo, Consolas, monospace; border-radius: 6px; padding: 2px 7px; }
  .mark.activity { color: var(--bar); background: var(--yellow); }
  .mark.bell { color: var(--bar); background: var(--red); }
  .mark.silence { color: var(--bar); background: var(--muted); }
  .pane .where { color: var(--muted); font-size: 13px; }
  .pane .top { display: flex; align-items: baseline; gap: 8px; }
  .pane .top .cmd { flex: 1; min-width: 0; }
  .pane .quiet { flex: none; color: var(--muted); font-size: 12px; }
  .pane .last {
    margin-top: 3px; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; color: var(--fg); opacity: .7;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .empty, .error { margin: 24px 16px; color: var(--muted); }
  .error { color: var(--red); }

  /* One pane */
  #screen {
    margin: 0; padding: 8px; white-space: pre; font-family: "Maple Mono NF CN", "Maple Mono", ui-monospace, Menlo, Consolas, monospace;
    line-height: 1.2; min-height: 100%;
  }
  /* A pane wider than the phone: its lines wrap at the phone's edge. */
  #screen.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
  #wrap.on { background: var(--accent); color: var(--bar); border-color: var(--accent); }
  /* Detailed mode: when each command ran, in a column left of its line. */
  #detail.on { background: var(--accent); color: var(--bar); border-color: var(--accent); }
  .stamp { color: var(--muted); cursor: pointer; }
  .stamp.fail { color: var(--red); }
  footer { background: var(--bar); border-top: 1px solid var(--line); padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px); }
  /* The keys: the usual ones in one row, the rest under ⋯; nothing to scroll. */
  .keys { display: flex; flex-wrap: wrap; gap: 5px; padding-bottom: 8px; }
  .keys button { flex: 1 0 auto; min-width: 32px; padding: 6px 4px; font: 13px ui-monospace, Menlo, Consolas, monospace; }
  .keys button.on { background: var(--accent); color: var(--bar); border-color: var(--accent); }
  #keys2 { padding-top: 0; }
  .typing { display: flex; gap: 6px; }
  .typing textarea {
    flex: 1; resize: none; font: 16px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; height: 40px; max-height: 120px;
  }
  .typing .send { background: var(--accent); color: var(--bar); border-color: var(--accent); font-weight: 600; min-width: 64px; }
  .typing .icon { flex: none; font-size: 18px; }
  header h1.switch { cursor: pointer; }
  /* Sheets from the bottom: the pane switcher, the history. */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 5; }
  .overlay .sheet {
    width: 100%; max-height: 75vh; overflow: auto; background: var(--bar); border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; padding: 8px 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  .overlay .head { margin: 6px 2px 8px; color: var(--muted); font-size: 13px; }
  .overlay .item { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .overlay .item .pick {
    flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .overlay .item .pick.mono { font: 14px ui-monospace, Menlo, Consolas, monospace; }
  .overlay .item .pick.here { border-color: var(--accent); }
  .overlay .item .small { flex: none; width: 36px; padding: 0; color: var(--muted); }
  .overlay .item .small.on { color: var(--yellow); }
  .overlay .sub { color: var(--muted); font-size: 12px; margin: 10px 2px 2px; }

  /* The + menu */
  #menu { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  #menu .sheet {
    width: 100%; background: var(--bar); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  #menu .sheet button { display: block; width: 100%; margin: 6px 0; padding: 12px; text-align: left; }
  #menu .sheet .danger { color: var(--red); }
  /* Asking for a name */
  #ask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  #ask .sheet {
    width: 100%; background: var(--bar); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding: 12px 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  #ask .title { margin: 4px 2px 10px; color: var(--muted); font-size: 14px; }
  #ask input {
    width: 100%; font: 16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  }
  #ask .row { display: flex; gap: 8px; margin-top: 10px; }
  #ask .row button { flex: 1; padding: 10px; }
  #ask .row .ok { background: var(--accent); color: var(--bar); border-color: var(--accent); font-weight: 600; }
  #toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <button id="back" class="icon hidden" aria-label="Back">&#8249;</button>
  <h1 id="title">keepane</h1>
  <button id="fit" class="icon hidden" aria-label="Fit to phone">&#10530;</button>
  <button id="wrap" class="icon hidden" aria-label="Wrap">&#8617;</button>
  <button id="detail" class="icon hidden" aria-label="Times">&#9201;</button>
  <button id="plus" class="icon hidden" aria-label="More">+</button>
</header>
<main id="main">
  <div id="list"></div>
  <pre id="screen" class="hidden"></pre>
</main>
<footer id="footer" class="hidden">
  <div class="keys" id="keys"></div>
  <div class="keys hidden" id="keys2"></div>
  <div class="typing">
    <button class="icon" id="histBtn" aria-label="History">&#9776;</button>
    <textarea id="text" rows="1" placeholder="Type, then send" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button class="send" id="send">Send</button>
  </div>
</footer>
<div id="menu" class="hidden">
  <div class="sheet">
    <button data-do="split-h">Split left | right</button>
    <button data-do="split-v">Split top / bottom</button>
    <button data-do="new-window">New window</button>
    <button data-do="rename-window">Rename this window</button>
    <button data-do="rename-session">Rename this session</button>
    <button data-do="kill-pane" class="danger">Close this pane</button>
    <button data-do="">Cancel</button>
  </div>
</div>
<div id="ask" class="hidden">
  <div class="sheet">
    <div class="title" id="askTitle"></div>
    <input id="askName" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="row"><button id="askCancel">Cancel</button><button id="askOk" class="ok">OK</button></div>
  </div>
</div>
<div id="switch" class="overlay hidden"><div class="sheet" id="switchList"></div></div>
<div id="hist" class="overlay hidden"><div class="sheet" id="histList"></div></div>
<div id="toast" class="hidden"></div>
<script>
"use strict";
// The key: from the address the QR code gave (then taken out of it, so it
// is not left in the address bar), or kept from last time on this phone.
// `#...&p=N` (the pane's number, `%N` in keepane) opens that pane straight away.
const startPane = ((m) => (m ? "%" + m[1] : null))(location.hash.match(/[#&]p=(?:%25|%)?(\d+)/));
const key = (() => {
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  try {
    if (m) { localStorage.setItem("keepane-key", m[1]); history.replaceState(null, "", location.pathname); return m[1]; }
    return localStorage.getItem("keepane-key") || "";
  } catch (e) { return m ? m[1] : ""; }
})();

const $ = (id) => document.getElementById(id);
const zh = /^zh/i.test(navigator.language);
const t = (en, cn) => (zh ? cn : en);
let readOnly = false, panes = [], current = null, lastText = "", timer = null;

// Buttons: what they show, what they send (a named key, `=` text, `@` the
// page's own: Ctrl, Alt, more keys). The usual ones, then the rest.
const KEYS = [
  ["Ctrl", "@ctrl"], ["Alt", "@alt"], ["Esc", "Escape"], ["Tab", "Tab"], ["↑", "Up"], ["↓", "Down"],
  ["←", "Left"], ["→", "Right"], ["⏎", "Enter"], ["^C", "C-c"], ["⋯", "@more"],
];
const MORE_KEYS = [
  ["⇧Tab", "BTab"], ["^D", "C-d"], ["^Z", "C-z"], ["^L", "C-l"], ["⌫", "BSpace"], ["Home", "Home"], ["End", "End"],
  ["PgUp", "PPage"], ["PgDn", "NPage"], ["y", "=y"], ["n", "=n"], ["1", "=1"], ["2", "=2"], ["3", "=3"],
];

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, cache: "no-store", headers: { "X-Keepane-Key": key, ...(opts.headers || {}) } });
  if (r.status === 401) throw new Error(t("This page needs the code again: run `keepane web` and scan it.", "需要重新扫码：在电脑上运行 `keepane web` 再扫一次。"));
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r;
}

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.remove("hidden");
  // Long enough to read: longer for more words.
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hidden"), Math.min(7000, Math.max(2200, msg.length * 60)));
}

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ---- The list ----
async function loadList() {
  try {
    panes = await (await api("/api/panes")).json();
    renderList();
  } catch (e) {
    $("list").innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}

// Grouped as keepane holds them: each session, its windows, their panes
// (list-panes -a gives them in that order). A session or window is renamed
// by way of one of its panes.
function renderList() {
  if (!panes.length) { $("list").innerHTML = `<p class="empty">${t("No panes.", "没有 pane。")}</p>`; return; }
  const pen = (kind, p, name) => readOnly ? "" :
    `<button class="rename" data-kind="${kind}" data-id="${esc(p.id)}" data-name="${esc(name)}" aria-label="${t("Rename", "重命名")}">&#9998;</button>`;
  // How much each session and window holds, for a folded one's line.
  const count = new Map();
  for (const p of panes) {
    const s = count.get(sKey(p)) || { windows: new Set(), panes: 0 };
    s.windows.add(p.window); s.panes++; count.set(sKey(p), s);
    count.set(wKey(p), (count.get(wKey(p)) || 0) + 1);
  }
  const chev = (k) => `<span class="chev">${folded.has(k) ? "&#9656;" : "&#9662;"}</span>`;
  let html = "", lastSession = null, lastWindow = null;
  for (const p of panes) {
    if (p.session !== lastSession) {
      const c = count.get(sKey(p));
      const sum = folded.has(sKey(p)) ? `<span class="count">${t(`${c.windows.size} windows · ${c.panes} panes`, `${c.windows.size} 个窗口 · ${c.panes} 个 pane`)}</span>` : "";
      html += `<div class="group session" data-fold="${esc(sKey(p))}">${chev(sKey(p))}<span class="name">${esc(p.session)}</span>${sum}${pen("session", p, p.session)}</div>`;
      lastSession = p.session; lastWindow = null;
    }
    if (folded.has(sKey(p))) continue;
    if (p.window !== lastWindow) {
      const sum = folded.has(wKey(p)) ? `<span class="count">${t(`${count.get(wKey(p))} panes`, `${count.get(wKey(p))} 个 pane`)}</span>` : "";
      html += `<div class="group window${p.windowActive ? " current" : ""}" data-fold="${esc(wKey(p))}">${chev(wKey(p))}` +
        `<span class="name">${p.window}: ${esc(p.windowName)}</span>${sum}${pen("window", p, p.windowName)}</div>`;
      lastWindow = p.window;
    }
    if (folded.has(wKey(p))) continue;
    const marks = (p.activity ? `<span class="mark activity" title="${t("printed", "有输出")}">#</span>` : "") +
      (p.bell ? `<span class="mark bell" title="${t("bell", "响铃")}">!</span>` : "") +
      (p.silence ? `<span class="mark silence" title="${t("silent", "没动静")}">~</span>` : "");
    const cls = ["pane", p.active && p.windowActive ? "current" : "", p.dead ? "dead" : "", marks ? "alert" : ""].join(" ");
    // The title the program set (what it says it is doing), else what it
    // runs, and how long it has been quiet; then what it runs when the
    // title took the first line, its name, mode and directory; the last
    // line it printed.
    const title = titleOf(p);
    const where = [title ? esc(p.command || "?") : "", p.name ? `<b>%${esc(p.name)}</b>` : "",
      p.mode && p.mode !== "normal" ? esc(p.mode) : "", esc(p.path || "")]
      .filter(Boolean).join(" · ");
    html += `<button class="${cls}" data-id="${esc(p.id)}"><span class="dot"></span><span class="what">` +
      `<div class="top"><span class="cmd">${esc(title || p.command || "?")}</span><span class="quiet">${quietFor(p.quiet)}</span></div>` +
      (where ? `<div class="where">${where}</div>` : "") +
      (p.last ? `<div class="last">${esc(p.last)}</div>` : "") + `</span>` +
      (marks ? `<span class="marks">${marks}</span>` : "") + `</button>`;
  }
  $("list").innerHTML = html;
}

// Folded sessions and windows, kept on this phone: the list is drawn anew
// every two seconds and the next visit, and stays as it was left.
const sKey = (p) => `s ${p.session}`;
const wKey = (p) => `w ${p.session}:${p.window}`;
const folded = new Set((() => { try { return JSON.parse(localStorage.getItem("keepane-folded") || "[]"); } catch (e) { return []; } })());
function toggleFold(k) {
  if (folded.has(k)) folded.delete(k); else folded.add(k);
  try { localStorage.setItem("keepane-folded", JSON.stringify([...folded])); } catch (e) {}
  renderList();
}

$("list").addEventListener("click", (e) => {
  const r = e.target.closest("button.rename");
  if (r) { rename(r.dataset.kind, r.dataset.id, r.dataset.name); return; }
  const g = e.target.closest(".group[data-fold]");
  if (g) { if (!bounced("fold " + g.dataset.fold)) toggleFold(g.dataset.fold); return; }
  const b = e.target.closest("button.pane");
  if (b && !bounced("open")) open(b.dataset.id, true);
});

// How long since a pane printed: "5s", "3m", "2h", "4d".
function quietFor(s) {
  if (s == null || isNaN(s)) return "";
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d`;
}

// ---- Names ----
// A sheet with the name to change; resolves to the new one, or null.
function askName(title, value) {
  return new Promise((resolve) => {
    $("askTitle").textContent = title; $("askName").value = value || "";
    $("ask").classList.remove("hidden"); $("askName").focus(); $("askName").select();
    const done = (v) => { $("ask").classList.add("hidden"); $("askOk").onclick = $("askCancel").onclick = $("askName").onkeydown = $("ask").onclick = null; resolve(v); };
    $("askOk").onclick = () => done($("askName").value.trim());
    $("askCancel").onclick = () => done(null);
    $("ask").onclick = (e) => { if (e.target === $("ask")) done(null); };
    $("askName").onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); done($("askName").value.trim()); } if (e.key === "Escape") done(null); };
  });
}
let renaming = false;
async function rename(kind, id, now) {
  if (renaming) return;
  renaming = true;
  try {
    const title = kind === "session" ? t("Rename the session", "重命名 session") : t("Rename the window", "重命名窗口");
    const name = await askName(title, now);
    if (name === null || name === now) return;
    await api(`/api/action?pane=${encodeURIComponent(id)}&do=rename-${kind}`, { method: "POST", body: name });
    panes = await (await api("/api/panes")).json();
    if (current) setTitle(); else renderList();
    toast(t("Renamed", "已重命名"));
  } catch (e) { toast(e.message); } finally { renaming = false; }
}

// ---- One pane ----
function paneInfo(id) { return panes.find((p) => p.id === id); }

// The title a pane's program set, when it says more than the program's
// name: a shell that sets its own path as the title (`C:\...\pwsh.exe`), or
// no title at all (keepane then gives the command), says nothing new.
function titleOf(p) {
  const title = (p.title || "").trim();
  const base = title.split(/[\\/]/).pop().replace(/\.exe$/i, "").toLowerCase();
  return !title || base === (p.command || "").toLowerCase() ? "" : title;
}

function setTitle() {
  const p = paneInfo(current);
  const title = p && titleOf(p);
  // The title large, then the program and where the pane is; with no title,
  // its name (or program) large, as before.
  $("title").innerHTML = !p ? esc(current || "")
    : title ? `${esc(title)} <span class="sub">${esc([p.name ? "%" + p.name : "", p.command || "?"].filter(Boolean).join(" · "))} · ${esc(p.session)}:${p.window}.${p.pane} &#9662;</span>`
    : `${esc(p.name ? "%" + p.name : p.command || "?")} <span class="sub">${esc(p.session)}:${p.window}.${p.pane} &#9662;</span>`;
  $("title").classList.toggle("switch", !!current);
}

// ---- Going from pane to pane ----
// The panes in the list's order.
const order = () => panes.map((p) => p.id);
// To another pane without a new step in the history: Back still goes to
// the list.
function switchTo(id) {
  if (!id || id === current) return;
  open(id, false);
  history.replaceState({ pane: id }, "");
}
// The title: every pane, to jump to.
$("title").addEventListener("click", () => {
  if (!current || bounced("switch")) return;
  let html = `<div class="head">${t("Go to a pane", "切换到 pane")}</div>`, lastS = null, lastW = null;
  for (const p of panes) {
    if (p.session !== lastS) { html += `<div class="sub">${esc(p.session)}</div>`; lastS = p.session; lastW = null; }
    if (p.window !== lastW) { html += `<div class="sub">&nbsp;&nbsp;${p.window}: ${esc(p.windowName)}</div>`; lastW = p.window; }
    const label = `${p.name ? "%" + p.name + " · " : ""}${titleOf(p) || p.command || "?"}${p.last ? " — " + p.last : ""}`;

}
function ansiToHtml(text) {
  text = text.replace(/\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, "").replace(/\x1b\[[0-9;?]*[A-Za-ln-z]/g, "");
  const st = { fg: null, bg: null, b: false, dim: false, i: false, u: false, inv: false };
  let out = "", last = 0, m;
  const span = (s) => {
    if (!s) return;
    let fg = st.fg, bg = st.bg;
    if (st.inv) { [fg, bg] = [bg || "var(--bg)", fg || "var(--fg)"]; }
    let css = "";
    if (fg) css += `color:${fg};`;
    if (bg) css += `background:${bg};`;
    if (st.b) css += "font-weight:700;";
    if (st.dim) css += "opacity:.65;";
    if (st.i) css += "font-style:italic;";
    if (st.u) css += "text-decoration:underline;";
    out += css ? `<span style="${css}">${esc(s)}</span>` : esc(s);
  };
  const re = /\x1b\[([0-9;]*)m/g;
  while ((m = re.exec(text))) {
    span(text.slice(last, m.index)); last = re.lastIndex;
    const c = m[1] === "" ? [0] : m[1].split(";").map(Number);
    for (let i = 0; i < c.length; i++) {
      const n = c[i];
      if (n === 0) Object.assign(st, { fg: null, bg: null, b: false, dim: false, i: false, u: false, inv: false });
      else if (n === 1) st.b = true; else if (n === 2) st.dim = true; else if (n === 3) st.i = true;
      else if (n === 4) st.u = true; else if (n === 7) st.inv = true;
      else if (n === 22) st.b = st.dim = false; else if (n === 23) st.i = false; else if (n === 24) st.u = false; else if (n === 27) st.inv = false;
      else if (n >= 30 && n <= 37) st.fg = PALETTE[n - 30]; else if (n === 39) st.fg = null;
      else if (n >= 40 && n <= 47) st.bg = PALETTE[n - 40]; else if (n === 49) st.bg = null;
      else if (n >= 90 && n <= 97) st.fg = PALETTE[n - 82]; else if (n >= 100 && n <= 107) st.bg = PALETTE[n - 92];
      else if (n === 38 || n === 48) {
        let col = null;
        if (c[i + 1] === 5) { col = colour256(c[i + 2] || 0); i += 2; }
        else if (c[i + 1] === 2) { col = `rgb(${c[i + 2] || 0},${c[i + 3] || 0},${c[i + 4] || 0})`; i += 4; }
        if (n === 38) st.fg = col; else st.bg = col;
      }
    }
  }
  span(text.slice(last));
  return out;
}

// ---- Refresh: a pane is pushed (or polled where it cannot be); the list is
// asked for every two seconds; nothing while the page is hidden ----
async function tick() {
  clearTimeout(timer);
  if (document.visibilityState !== "visible") return;
  if (current && streaming) { if (!watcher) watchScreen(); return; }
  if (current) await loadScreen(); else await loadList();
  timer = setTimeout(tick, current ? 500 : 2000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") tick(); else { clearTimeout(timer); stopWatch(); }
});

// The keyboard takes part of the screen: keep the input above it.
if (window.visualViewport) {
  const vv = () => document.documentElement.style.setProperty("--vh", visualViewport.height + "px");
  visualViewport.addEventListener("resize", vv); vv();
}
