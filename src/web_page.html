<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16161e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>keepane</title>
<style>
  :root {
    --bg: #1a1b26; --bar: #16161e; --card: #24283b; --line: #3b4261;
    --fg: #c0caf5; --muted: #565f89; --accent: #7aa2f7; --green: #9ece6a; --red: #f7768e; --yellow: #e0af68;
    --vh: 100dvh;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: var(--vh); display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px; background: var(--bar);
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; border-bottom: 1px solid var(--line);
  }
  header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sub { color: var(--muted); font-weight: 400; }
  button {
    font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer;
  }
  button:active { background: var(--line); }
  /* No double-tap zoom and no tap delay: a tap is taken as one, at once. */
  button, textarea, input { touch-action: manipulation; }
  .icon { width: 36px; padding: 0; font-size: 20px; line-height: 1; }
  main { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
  .hidden { display: none !important; }

  /* The list: each session, its windows, their panes */
  .group { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .group .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session { margin: 14px 12px 2px; color: var(--accent); font-size: 14px; font-weight: 600; }
  .window { margin: 6px 12px 0 22px; color: var(--muted); font-size: 13px; }
  .window.current { color: var(--fg); }
  .group[data-fold] { cursor: pointer; min-height: 34px; user-select: none; }
  .chev { width: 14px; flex: none; color: var(--muted); font-size: 12px; }
  .count { flex: none; color: var(--muted); font-size: 12px; font-weight: 400; }
  .rename { min-height: 28px; width: 32px; padding: 0; font-size: 14px; color: var(--muted); background: transparent; border-color: transparent; flex: none; }
  .pane {
    display: flex; align-items: center; gap: 10px; margin: 6px 12px 6px 22px; padding: 10px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; width: calc(100% - 34px); text-align: left;
  }
  .pane .cmd, .pane .where { overflow-wrap: anywhere; }
  .pane .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .pane.current .dot { background: var(--green); }
  .pane.dead .dot { background: var(--red); }
  .pane .what { flex: 1; min-width: 0; }
  .pane .cmd { font-weight: 600; }
  /* The window's alerts, the marks the status line shows: # printed, ! bell, ~ silent. */
  .pane.alert { border-color: var(--yellow); }
  .marks { display: flex; gap: 4px; flex: none; }
  .mark { font: 600 13px ui-monospace, Menlo, Consolas, monospace; border-radius: 6px; padding: 2px 7px; }
  .mark.activity { color: var(--bar); background: var(--yellow); }
  .mark.bell { color: var(--bar); background: var(--red); }
  .mark.silence { color: var(--bar); background: var(--muted); }
  .pane .where { color: var(--muted); font-size: 13px; }
  .empty, .error { margin: 24px 16px; color: var(--muted); }
  .error { color: var(--red); }

  /* One pane */
  #screen {
    margin: 0; padding: 8px; white-space: pre; font-family: "Maple Mono NF CN", "Maple Mono", ui-monospace, Menlo, Consolas, monospace;
    line-height: 1.2; min-height: 100%;
  }
  /* A pane wider than the phone: its lines wrap at the phone's edge. */
  #screen.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
  #wrap.on { background: var(--accent); color: var(--bar); border-color: var(--accent); }
  /* Detailed mode: when each command ran, in a column left of its line. */
  #detail.on { background: var(--accent); color: var(--bar); border-color: var(--accent); }
  .stamp { color: var(--muted); cursor: pointer; }
  .stamp.fail { color: var(--red); }
  footer { background: var(--bar); border-top: 1px solid var(--line); padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px); }
  .keys { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .keys::-webkit-scrollbar { display: none; }
  .keys button { flex: none; min-width: 44px; padding: 6px 10px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .typing { display: flex; gap: 6px; }
  .typing textarea {
    flex: 1; resize: none; font: 16px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; height: 40px; max-height: 120px;
  }
  .typing .send { background: var(--accent); color: var(--bar); border-color: var(--accent); font-weight: 600; }

  /* The + menu */
  #menu { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  #menu .sheet {
    width: 100%; background: var(--bar); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  #menu .sheet button { display: block; width: 100%; margin: 6px 0; padding: 12px; text-align: left; }
  #menu .sheet .danger { color: var(--red); }
  /* Asking for a name */
  #ask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  #ask .sheet {
    width: 100%; background: var(--bar); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding: 12px 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  #ask .title { margin: 4px 2px 10px; color: var(--muted); font-size: 14px; }
  #ask input {
    width: 100%; font: 16px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  }
  #ask .row { display: flex; gap: 8px; margin-top: 10px; }
  #ask .row button { flex: 1; padding: 10px; }
  #ask .row .ok { background: var(--accent); color: var(--bar); border-color: var(--accent); font-weight: 600; }
  #toast {
    position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <button id="back" class="icon hidden" aria-label="Back">&#8249;</button>
  <h1 id="title">keepane</h1>
  <button id="wrap" class="icon hidden" aria-label="Wrap">&#8617;</button>
  <button id="detail" class="icon hidden" aria-label="Times">&#9201;</button>
  <button id="plus" class="icon hidden" aria-label="More">+</button>
</header>
<main id="main">
  <div id="list"></div>
  <pre id="screen" class="hidden"></pre>
</main>
<footer id="footer" class="hidden">
  <div class="keys" id="keys"></div>
  <div class="typing">
    <textarea id="text" rows="1" placeholder="Type, then send" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button class="send" id="send">Send</button>
  </div>
</footer>
<div id="menu" class="hidden">
  <div class="sheet">
    <button data-do="split-h">Split left | right</button>
    <button data-do="split-v">Split top / bottom</button>
    <button data-do="new-window">New window</button>
    <button data-do="rename-window">Rename this window</button>
    <button data-do="rename-session">Rename this session</button>
    <button data-do="kill-pane" class="danger">Close this pane</button>
    <button data-do="">Cancel</button>
  </div>
</div>
<div id="ask" class="hidden">
  <div class="sheet">
    <div class="title" id="askTitle"></div>
    <input id="askName" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="row"><button id="askCancel">Cancel</button><button id="askOk" class="ok">OK</button></div>
  </div>
</div>
<div id="toast" class="hidden"></div>
<script>
"use strict";
// The key: from the address the QR code gave (then taken out of it, so it
// is not left in the address bar), or kept from last time on this phone.
// `#...&p=N` (the pane's number, `%N` in keepane) opens that pane straight away.
const startPane = ((m) => (m ? "%" + m[1] : null))(location.hash.match(/[#&]p=(?:%25|%)?(\d+)/));
const key = (() => {
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  try {
    if (m) { localStorage.setItem("keepane-key", m[1]); history.replaceState(null, "", location.pathname); return m[1]; }
    return localStorage.getItem("keepane-key") || "";
  } catch (e) { return m ? m[1] : ""; }
})();

const $ = (id) => document.getElementById(id);
const zh = /^zh/i.test(navigator.language);
const t = (en, cn) => (zh ? cn : en);
let readOnly = false, panes = [], current = null, lastText = "", timer = null;

// Buttons: what they show, what they send (a named key, or text).
const KEYS = [
  ["Esc", "Escape"], ["Tab", "Tab"], ["⇧Tab", "BTab"], ["↑", "Up"], ["↓", "Down"], ["←", "Left"], ["→", "Right"],
  ["^C", "C-c"], ["^D", "C-d"], ["⏎", "Enter"], ["y", "=y"], ["n", "=n"], ["1", "=1"], ["2", "=2"], ["3", "=3"],
  ["⌫", "BSpace"], ["PgUp", "PPage"], ["PgDn", "NPage"],
];

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, cache: "no-store", headers: { "X-Keepane-Key": key, ...(opts.headers || {}) } });
  if (r.status === 401) throw new Error(t("This page needs the code again: run `keepane web` and scan it.", "需要重新扫码：在电脑上运行 `keepane web` 再扫一次。"));
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r;
}

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.remove("hidden");
  // Long enough to read: longer for more words.
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hidden"), Math.min(7000, Math.max(2200, msg.length * 60)));
}

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ---- The list ----
async function loadList() {
  try {
    panes = await (await api("/api/panes")).json();
    renderList();
  } catch (e) {
    $("list").innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}

// Grouped as keepane holds them: each session, its windows, their panes
// (list-panes -a gives them in that order). A session or window is renamed
// by way of one of its panes.
function renderList() {
  if (!panes.length) { $("list").innerHTML = `<p class="empty">${t("No panes.", "没有 pane。")}</p>`; return; }
  const pen = (kind, p, name) => readOnly ? "" :
    `<button class="rename" data-kind="${kind}" data-id="${esc(p.id)}" data-name="${esc(name)}" aria-label="${t("Rename", "重命名")}">&#9998;</button>`;
  // How much each session and window holds, for a folded one's line.
  const count = new Map();
  for (const p of panes) {
    const s = count.get(sKey(p)) || { windows: new Set(), panes: 0 };
    s.windows.add(p.window); s.panes++; count.set(sKey(p), s);
    count.set(wKey(p), (count.get(wKey(p)) || 0) + 1);
  }
  const chev = (k) => `<span class="chev">${folded.has(k) ? "&#9656;" : "&#9662;"}</span>`;
  let html = "", lastSession = null, lastWindow = null;
  for (const p of panes) {
    if (p.session !== lastSession) {
      const c = count.get(sKey(p));
      const sum = folded.has(sKey(p)) ? `<span class="count">${t(`${c.windows.size} windows · ${c.panes} panes`, `${c.windows.size} 个窗口 · ${c.panes} 个 pane`)}</span>` : "";
      html += `<div class="group session" data-fold="${esc(sKey(p))}">${chev(sKey(p))}<span class="name">${esc(p.session)}</span>${sum}${pen("session", p, p.session)}</div>`;
      lastSession = p.session; lastWindow = null;
    }
    if (folded.has(sKey(p))) continue;
    if (p.window !== lastWindow) {
      const sum = folded.has(wKey(p)) ? `<span class="count">${t(`${count.get(wKey(p))} panes`, `${count.get(wKey(p))} 个 pane`)}</span>` : "";
      html += `<div class="group window${p.windowActive ? " current" : ""}" data-fold="${esc(wKey(p))}">${chev(wKey(p))}` +
        `<span class="name">${p.window}: ${esc(p.windowName)}</span>${sum}${pen("window", p, p.windowName)}</div>`;
      lastWindow = p.window;
    }
    if (folded.has(wKey(p))) continue;
    const marks = (p.activity ? `<span class="mark activity" title="${t("printed", "有输出")}">#</span>` : "") +
      (p.bell ? `<span class="mark bell" title="${t("bell", "响铃")}">!</span>` : "") +
      (p.silence ? `<span class="mark silence" title="${t("silent", "没动静")}">~</span>` : "");
    const cls = ["pane", p.active && p.windowActive ? "current" : "", p.dead ? "dead" : "", marks ? "alert" : ""].join(" ");
    html += `<button class="${cls}" data-id="${esc(p.id)}"><span class="dot"></span><span class="what">` +
      `<div class="cmd">${esc(p.command || "?")}</div>` +
      `<div class="where">${p.name ? `<b>%${esc(p.name)}</b> · ` : ""}${p.mode && p.mode !== "normal" ? `${esc(p.mode)} · ` : ""}` +
      `${t("pane", "pane")} ${p.pane} · ${p.cols}×${p.rows}</div></span>` +
      (marks ? `<span class="marks">${marks}</span>` : "") + `</button>`;
  }
  $("list").innerHTML = html;
}

// Folded sessions and windows, kept on this phone: the list is drawn anew
// every two seconds and the next visit, and stays as it was left.
const sKey = (p) => `s ${p.session}`;
const wKey = (p) => `w ${p.session}:${p.window}`;
const folded = new Set((() => { try { return JSON.parse(localStorage.getItem("keepane-folded") || "[]"); } catch (e) { return []; } })());
function toggleFold(k) {
  if (folded.has(k)) folded.delete(k); else folded.add(k);
  try { localStorage.setItem("keepane-folded", JSON.stringify([...folded])); } catch (e) {}
  renderList();
}

$("list").addEventListener("click", (e) => {
  const r = e.target.closest("button.rename");
  if (r) { rename(r.dataset.kind, r.dataset.id, r.dataset.name); return; }
  const g = e.target.closest(".group[data-fold]");
  if (g) { if (!bounced("fold " + g.dataset.fold)) toggleFold(g.dataset.fold); return; }
  const b = e.target.closest("button.pane");
  if (b && !bounced("open")) open(b.dataset.id, true);
});

// ---- Names ----
// A sheet with the name to change; resolves to the new one, or null.
function askName(title, value) {
  return new Promise((resolve) => {
    $("askTitle").textContent = title; $("askName").value = value || "";
    $("ask").classList.remove("hidden"); $("askName").focus(); $("askName").select();
    const done = (v) => { $("ask").classList.add("hidden"); $("askOk").onclick = $("askCancel").onclick = $("askName").onkeydown = $("ask").onclick = null; resolve(v); };
    $("askOk").onclick = () => done($("askName").value.trim());
    $("askCancel").onclick = () => done(null);
    $("ask").onclick = (e) => { if (e.target === $("ask")) done(null); };
    $("askName").onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); done($("askName").value.trim()); } if (e.key === "Escape") done(null); };
  });
}
let renaming = false;
async function rename(kind, id, now) {
  if (renaming) return;
  renaming = true;
  try {
    const title = kind === "session" ? t("Rename the session", "重命名 session") : t("Rename the window", "重命名窗口");
    const name = await askName(title, now);
    if (name === null || name === now) return;
    await api(`/api/action?pane=${encodeURIComponent(id)}&do=rename-${kind}`, { method: "POST", body: name });
    panes = await (await api("/api/panes")).json();
    if (current) setTitle(); else renderList();
    toast(t("Renamed", "已重命名"));
  } catch (e) { toast(e.message); } finally { renaming = false; }
}

// ---- One pane ----
function paneInfo(id) { return panes.find((p) => p.id === id); }

function setTitle() {
  const p = paneInfo(current);
  $("title").innerHTML = p ? `${esc(p.name ? "%" + p.name : p.command || "?")} <span class="sub">${esc(p.session)}:${p.window}.${p.pane}</span>` : esc(current || "");
}

function open(id, push) {
  current = id;
  if (push) history.pushState({ pane: id }, "");
  setTitle();
  $("list").classList.add("hidden"); $("screen").classList.remove("hidden");
  $("back").classList.remove("hidden"); $("detail").classList.remove("hidden"); $("wrap").classList.remove("hidden");
  $("plus").classList.toggle("hidden", readOnly); $("footer").classList.toggle("hidden", readOnly);
  lastText = ""; shown = { text: "", marks: [] }; $("screen").innerHTML = ""; stick = true;
  stopWatch(); fitFont(); tick();
}

function showList(push) {
  current = null;
  stopWatch();
  if (push) history.pushState({}, "");
  $("title").textContent = "keepane";
  $("screen").classList.add("hidden"); $("list").classList.remove("hidden");
  $("back").classList.add("hidden"); $("detail").classList.add("hidden"); $("wrap").classList.add("hidden"); $("plus").classList.add("hidden"); $("footer").classList.add("hidden");
  tick();
}

$("back").addEventListener("click", () => history.back());
window.addEventListener("popstate", (e) => (e.state && e.state.pane ? open(e.state.pane, false) : showList(false)));

// Fit the pane's width to the phone's (not below a readable size; past
// that, it scrolls sideways).
let charRatio = 0.6;
(() => {
  const probe = document.createElement("span");
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font-size:100px;font-family:" + getComputedStyle($("screen")).fontFamily;
  probe.textContent = "M".repeat(20); document.body.appendChild(probe);
  charRatio = probe.getBoundingClientRect().width / 2000 || 0.6; probe.remove();
})();
// A pane too wide to read at the phone's width: its lines wrap at a size
// that reads (the default), or keep their width and scroll sideways (the
// ↩ button, for a full-screen program whose boxes wrapping would break).
const READABLE = 9, WRAPPED = 12;
let wrap = (() => { try { return localStorage.getItem("keepane-wrap") !== "0"; } catch (e) { return true; } })();
function fitFont() {
  const p = paneInfo(current); const cols = (p ? p.cols : 80) + (detail ? GUTTER : 0);
  const width = $("main").clientWidth - 16;
  const fit = width / (cols * charRatio);
  const wrapping = wrap && fit < READABLE;
  const was = joined();
  $("screen").classList.toggle("wrap", wrapping);
  $("screen").style.fontSize = (wrapping ? WRAPPED : Math.max(8, Math.min(15, fit))).toFixed(2) + "px";
  // Asked for as the pane has them, or joined: a change asks again.
  if (current && joined() !== was) { lastText = null; stopWatch(); tick(); }
}
// Wrapping here, the lines the pane itself wrapped come joined, so that a
// line breaks once, at the phone's edge (the command times are placed on
// the joined lines by keepane).
function joined() { return $("screen").classList.contains("wrap"); }
const screenQuery = (id) => `pane=${encodeURIComponent(id)}&history=300${joined() ? "&join=1" : ""}`;
window.addEventListener("resize", fitFont);
$("wrap").classList.toggle("on", wrap);
$("wrap").addEventListener("click", () => {
  wrap = !wrap;
  try { localStorage.setItem("keepane-wrap", wrap ? "1" : "0"); } catch (e) {}
  $("wrap").classList.toggle("on", wrap);
  fitFont();
  toast(wrap ? t("Long lines wrap", "长行自动换行") : t("Long lines scroll sideways", "长行左右滑动"));
});

// Follow the bottom unless the reader has scrolled up.
let stick = true;
$("main").addEventListener("scroll", () => {
  const m = $("main"); stick = m.scrollHeight - m.scrollTop - m.clientHeight < 40;
});

// Detailed mode: a column left of the screen with the time each command
// started on its line (the date when not today); tapping it says more. The
// pane keeps its size: the column is the page's, not the pane's.
const GUTTER = 6;
let detail = (() => { try { return localStorage.getItem("keepane-detail") === "1"; } catch (e) { return false; } })();
let shown = { text: "", marks: [] };
const pad2 = (n) => String(n).padStart(2, "0");
function stampText(m) {
  const d = new Date(m[1] ?? m[2]), now = new Date();
  return d.toDateString() === now.toDateString() ? `${pad2(d.getHours())}:${pad2(d.getMinutes())}`
    : `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function took(ms) {
  if (ms < 1000) return `${ms}ms`;
  if (ms < 10000) return `${(ms / 1000).toFixed(1)}s`;
  if (ms < 60000) return `${Math.floor(ms / 1000)}s`;
  if (ms < 3600000) return `${Math.floor(ms / 60000)}m${pad2(Math.floor(ms / 1000) % 60)}s`;
  return `${Math.floor(ms / 3600000)}h${pad2(Math.floor(ms / 60000) % 60)}m`;
}
function stampDetail(m) {
  const [, start, end, exit] = m, d = new Date(start ?? end);
  let s = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ` +
    `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  if (start != null && end != null) s += ` · ${took(end - start)}`;
  if (exit === 0) s += " · ✓";
  else if (exit != null) s += ` · ✗ ${t("exit", "退出码")} ${exit}`;
  return s;
}
$("detail").classList.toggle("on", detail);
$("detail").addEventListener("click", () => {
  detail = !detail;
  try { localStorage.setItem("keepane-detail", detail ? "1" : "0"); } catch (e) {}
  $("detail").classList.toggle("on", detail);
  fitFont(); lastText = null; showScreen(shown.text, shown.marks);
  // Nothing to show is said, not left to look like a broken button.
  if (detail && !shown.marks.length) {
    toast(t("No command times here yet: a time is kept for each command the pane's shell (PowerShell, zsh, bash 4.4+) finishes, from the pane's start",
      "这个 pane 还没有命令时间：只记录 pane 启动后、在 shell（PowerShell、zsh、bash 4.4+）里执行完的命令"));
  }
});
$("screen").addEventListener("click", (e) => {
  const s = e.target.closest(".stamp");
  const m = s && shown.marks.find((m) => m[0] === Number(s.dataset.i));
  if (m) toast(stampDetail(m));
});

function showScreen(text, marks) {
  marks = marks || [];
  const key = text + "\u0000" + JSON.stringify(marks) + detail;
  if (key === lastText) return;
  lastText = key; shown = { text, marks };
  // The rows under the last line with something on it are empty: without
  // them, following the bottom shows the last output, not blank rows.
  const lines = text.split("\n");
  const blank = (l) => !l.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, "").trim();
  while (lines.length && blank(lines[lines.length - 1])) lines.pop();
  if (detail) {
    // capture-pane ends every coloured line with a reset, so each line can
    // be turned into HTML on its own.
    const at = new Map(marks.map((m) => [m[0], m]));
    $("screen").innerHTML = lines.map((l, i) => {
      const m = at.get(i);
      const g = m ? `<span class="stamp${m[3] ? " fail" : ""}" data-i="${i}">${stampText(m)}</span> ` : " ".repeat(GUTTER);
      return g + ansiToHtml(l);
    }).join("\n");
  } else {
    $("screen").innerHTML = ansiToHtml(lines.join("\n"));
  }
  if (stick) $("main").scrollTop = $("main").scrollHeight;
}
const showError = (msg) => ($("screen").innerHTML = `<span style="color:var(--red)">${esc(msg)}</span>`);

// Polling, for a browser that cannot read a response as it arrives.
async function loadScreen() {
  try {
    const s = await (await api(`/api/screen?${screenQuery(current)}`)).json();
    showScreen(s.text, s.marks);
  } catch (e) { showError(e.message); }
}

// The screen, pushed: one long response that carries the screen again each
// time it changes. Reconnects after a drop; stops when the pane is left or
// the page is hidden (which saves the phone's battery).
let watcher = null, streaming = true;
function stopWatch() { if (watcher) { watcher.abort(); watcher = null; } }
async function watchScreen() {
  stopWatch();
  const ctl = new AbortController(); watcher = ctl;
  const id = current;
  while (!ctl.signal.aborted && current === id) {
    try {
      const r = await fetch(`/api/watch?${screenQuery(id)}`,
        { headers: { "X-Keepane-Key": key }, cache: "no-store", signal: ctl.signal });
      if (r.status === 401) { showError(t("This page needs the code again: run `keepane web` and scan it.", "需要重新扫码：在电脑上运行 `keepane web` 再扫一次。")); return; }
      if (!r.ok) { showError((await r.text()) || r.statusText); throw new Error("retry"); }
      if (!r.body || !r.body.getReader) {
        // This browser cannot read a response as it arrives: ask every
        // half second instead.
        streaming = false; watcher = null; tick(); return;
      }
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let end;
        while ((end = buf.indexOf("\n\n")) >= 0) {
          const ev = buf.slice(0, end); buf = buf.slice(end + 2);
          if (ev.startsWith("event: gone")) { showError(t("This pane is gone.", "这个 pane 已经关了。")); ctl.abort(); return; }
          const data = ev.split("\n").filter((l) => l.startsWith("data: ")).map((l) => l.slice(6)).join("\n");
          if (data) { const s = JSON.parse(data); showScreen(s.text, s.marks); }
        }
      }
    } catch (e) {
      if (ctl.signal.aborted) return;
    }
    await new Promise((res) => setTimeout(res, 1000)); // then connect again
  }
}

// ---- Typing ----
// Everything typed goes out in the order it was tapped, one after the
// other (a key tapped while text is on its way lands after it). Resolves
// to whether it got there.
let queue = Promise.resolve(true);
function send(query, body) {
  if (!current) return Promise.resolve(false);
  const id = current;
  queue = queue.then(async () => {
    try {
      await api(`/api/send?pane=${encodeURIComponent(id)}${query}`, { method: "POST", body: body || "" });
      if (!streaming) setTimeout(loadScreen, 120); // pushed otherwise
      return true;
    } catch (e) { toast(e.message); return false; }
  });
  return queue;
}
const sendKey = (k) => (k.startsWith("=") ? send("", k.slice(1)) : send(`&key=${encodeURIComponent(k)}`));

// A tap is one press: the same button again within BOUNCE_MS is a finger
// bouncing or a tap reported twice, not a second press (a key pressed on
// purpose again comes later than that).
const BOUNCE_MS = 250;
const lastTap = new Map();
function bounced(what) {
  const now = Date.now(), last = lastTap.get(what) || 0;
  lastTap.set(what, now);
  return now - last < BOUNCE_MS;
}

$("keys").innerHTML = KEYS.map(([label, k]) => `<button data-k="${esc(k)}">${esc(label)}</button>`).join("");
$("keys").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b && !bounced("key " + b.dataset.k)) sendKey(b.dataset.k);
});

// The text leaves the box at once, so a second tap while it is on its way
// finds nothing to send again; while it goes, Send does nothing. Put back
// if it did not get there.
let sending = false;
async function sendText() {
  if (sending || bounced("send")) return;
  const box = $("text"); const text = box.value;
  box.value = ""; box.style.height = "";
  sending = true;
  try {
    if (text && !(await send("", text))) { if (!box.value) box.value = text; return; }
    await send("&key=Enter");
  } finally { sending = false; }
}
$("send").addEventListener("click", sendText);
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); } });
$("text").addEventListener("input", (e) => { e.target.style.height = ""; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px"; });

// ---- The + menu ----
$("plus").addEventListener("click", () => $("menu").classList.remove("hidden"));
// One action at a time: a second tap while one runs (a split, a new
// window) would make a second one.
let acting = false;
$("menu").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b && e.target !== $("menu")) return;
  $("menu").classList.add("hidden");
  const what = b ? b.dataset.do : "";
  if (!what || !current || acting) return;
  if (what.startsWith("rename-")) {
    const p = paneInfo(current) || {};
    const kind = what.slice("rename-".length);
    rename(kind, current, kind === "session" ? p.session : p.windowName);
    return;
  }
  if (what === "kill-pane" && !confirm(t("Close this pane? What runs in it stops.", "关闭这个 pane？里面运行的程序会被结束。"))) return;
  acting = true;
  try {
    const before = new Set(panes.map((p) => p.id));
    await api(`/api/action?pane=${encodeURIComponent(current)}&do=${what}`, { method: "POST" });
    panes = await (await api("/api/panes")).json();
    if (what === "kill-pane") { history.back(); return; }
    // Go to the pane the action made.
    const made = panes.find((p) => !before.has(p.id));
    if (made) open(made.id, true);
  } catch (err) { toast(err.message); } finally { acting = false; }
});

// ---- Colours: the SGR sequences capture-pane -e writes ----
const PALETTE = ["#15161e", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#a9b1d6",
  "#414868", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#c0caf5"];
function colour256(n) {
  if (n < 16) return PALETTE[n];
  if (n >= 232) { const v = 8 + 10 * (n - 232); return `rgb(${v},${v},${v})`; }
  n -= 16; const s = [0, 95, 135, 175, 215, 255];
  return `rgb(${s[Math.floor(n / 36)]},${s[Math.floor(n / 6) % 6]},${s[n % 6]})`;
}
function ansiToHtml(text) {
  text = text.replace(/\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, "").replace(/\x1b\[[0-9;?]*[A-Za-ln-z]/g, "");
  const st = { fg: null, bg: null, b: false, dim: false, i: false, u: false, inv: false };
  let out = "", last = 0, m;
  const span = (s) => {
    if (!s) return;
    let fg = st.fg, bg = st.bg;
    if (st.inv) { [fg, bg] = [bg || "var(--bg)", fg || "var(--fg)"]; }
    let css = "";
    if (fg) css += `color:${fg};`;
    if (bg) css += `background:${bg};`;
    if (st.b) css += "font-weight:700;";
    if (st.dim) css += "opacity:.65;";
    if (st.i) css += "font-style:italic;";
    if (st.u) css += "text-decoration:underline;";
    out += css ? `<span style="${css}">${esc(s)}</span>` : esc(s);
  };
  const re = /\x1b\[([0-9;]*)m/g;
  while ((m = re.exec(text))) {
    span(text.slice(last, m.index)); last = re.lastIndex;
    const c = m[1] === "" ? [0] : m[1].split(";").map(Number);
    for (let i = 0; i < c.length; i++) {
      const n = c[i];
      if (n === 0) Object.assign(st, { fg: null, bg: null, b: false, dim: false, i: false, u: false, inv: false });
      else if (n === 1) st.b = true; else if (n === 2) st.dim = true; else if (n === 3) st.i = true;
      else if (n === 4) st.u = true; else if (n === 7) st.inv = true;
      else if (n === 22) st.b = st.dim = false; else if (n === 23) st.i = false; else if (n === 24) st.u = false; else if (n === 27) st.inv = false;
      else if (n >= 30 && n <= 37) st.fg = PALETTE[n - 30]; else if (n === 39) st.fg = null;
      else if (n >= 40 && n <= 47) st.bg = PALETTE[n - 40]; else if (n === 49) st.bg = null;
      else if (n >= 90 && n <= 97) st.fg = PALETTE[n - 82]; else if (n >= 100 && n <= 107) st.bg = PALETTE[n - 92];
      else if (n === 38 || n === 48) {
        let col = null;
        if (c[i + 1] === 5) { col = colour256(c[i + 2] || 0); i += 2; }
        else if (c[i + 1] === 2) { col = `rgb(${c[i + 2] || 0},${c[i + 3] || 0},${c[i + 4] || 0})`; i += 4; }
        if (n === 38) st.fg = col; else st.bg = col;
      }
    }
  }
  span(text.slice(last));
  return out;
}

// ---- Refresh: a pane is pushed (or polled where it cannot be); the list is
// asked for every two seconds; nothing while the page is hidden ----
async function tick() {
  clearTimeout(timer);
  if (document.visibilityState !== "visible") return;
  if (current && streaming) { if (!watcher) watchScreen(); return; }
  if (current) await loadScreen(); else await loadList();
  timer = setTimeout(tick, current ? 500 : 2000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") tick(); else { clearTimeout(timer); stopWatch(); }
});

// The keyboard takes part of the screen: keep the input above it.
if (window.visualViewport) {
  const vv = () => document.documentElement.style.setProperty("--vh", visualViewport.height + "px");
  visualViewport.addEventListener("resize", vv); vv();
}

(async () => {
  $("text").placeholder = t("Type, then send", "输入后发送");
  $("send").textContent = t("Send", "发送");
  $("detail").title = t("When each command ran", "每条命令的时间");
  const labels = { "split-h": t("Split left | right", "左右分屏"), "split-v": t("Split top / bottom", "上下分屏"),
    "new-window": t("New window", "新窗口"), "kill-pane": t("Close this pane", "关闭这个 pane"), "": t("Cancel", "取消"),
    "rename-window": t("Rename this window", "重命名这个窗口"),
    "rename-session": t("Rename this session", "重命名这个 session") };
  $("askOk").textContent = t("OK", "确定"); $("askCancel").textContent = t("Cancel", "取消");
  $("wrap").title = t("Wrap long lines", "长行换行");
  for (const b of document.querySelectorAll("#menu button")) b.textContent = labels[b.dataset.do];
  try {
    const info = await (await api("/api/info")).json();
    readOnly = info.readOnly;
    document.title = `keepane · ${info.host}`;
  } catch (e) {
    $("list").innerHTML = `<p class="error">${esc(e.message)}</p>`;
    return;
  }
  history.replaceState({}, "");
  if (startPane) {
    try { panes = await (await api("/api/panes")).json(); } catch (e) {}
    open(startPane, true);
    return;
  }
  tick();
})();
</script>
