[package]
name = "keepane"
version = "0.30.1"
edition = "2024"
rust-version = "1.88"
description = "A terminal multiplexer whose panes keep running after you detach and can pass messages to each other, with tmux's keys and commands."
license = "MIT"
repository = "https://github.com/newdee/keepane"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bincode = "1"
chrono = "0.4.45"
dirs = "7.0.0"
log = "0.4.34"
portable-pty = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
unicode-width = "0.2.2"
vt100 = "0.16"
# `keepane web`'s pairing code: drawn as text in the terminal, no image support.
qrcode = { version = "0.14", default-features = false }
# `keepane link`: each server's key pair signs what it sends another machine
# (docs/design/link.md), and SHA-256 for the digests and the pairing's HMAC.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# WinRT toasts (the notification with a "Go to pane" button); everything
# else Win32 goes through windows-sys.
windows = { version = "0.61", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
# termios, signals, process groups.
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"

[patch.crates-io]
vt100 = { path = "vendor/vt100" }

