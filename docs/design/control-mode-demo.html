<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>控制模式演示</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #fffdf9; --ink: #1f2328; --muted: #6b6f76; --line: #e2ddd3;
  --term: #15171c; --term-ink: #d7dae0; --term-dim: #7d8590; --accent: #2f6fde; --ok: #1f8a4c;
  --warn: #b26a00; --out: #2f6fde; --in: #a43ac2; --cmd: #b26a00; --shape: #1f8a4c;
  --status: #3c8d40;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #181b20; --ink: #e6e8eb; --muted: #9aa1aa; --line: #2a2f37;
    --term: #0d0f12; --accent: #6ea2ff; --out: #6ea2ff; --in: #d58cf0; --cmd: #e2a440; --shape: #4fc27f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
main { max-width: 1320px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); color: var(--ink); padding: 7px 14px; cursor: pointer; font: inherit; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px;
  padding: 7px 12px; cursor: pointer; font: inherit; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.grid { display: grid; grid-template-columns: 260px minmax(260px, 1fr) minmax(420px, 1.6fr); gap: 14px; }
@media (max-width: 1050px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.card h2 { font-size: 13px; letter-spacing: .02em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.mono { font-family: "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace; }
ul.tree { list-style: none; padding: 0; margin: 0; }
ul.tree li { padding: 3px 0; }
.chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
.kv { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.log { height: 470px; overflow-y: auto; font-size: 12px; }
.frame { display: grid; grid-template-columns: 22px 92px 1fr; gap: 6px; padding: 4px 2px; border-bottom: 1px solid var(--line); animation: pop .25s ease-out; }
@keyframes pop { from { background: color-mix(in srgb, var(--accent) 16%, transparent); } to { background: transparent; } }
.dir { font-weight: 700; }
.k-out { color: var(--out); } .k-in { color: var(--in); } .k-cmd { color: var(--cmd); } .k-shape { color: var(--shape); } .k-hs { color: var(--muted); }
.empty { color: var(--muted); padding: 14px 4px; }
.screen { background: var(--term); color: var(--term-ink); border-radius: 10px; padding: 0; overflow: hidden; height: 470px; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: #1d2027; }
.tab { padding: 5px 12px; border-radius: 8px 8px 0 0; color: var(--term-dim); font-size: 12px; background: #23272f; }
.tab.on { background: var(--term); color: var(--term-ink); }
.panes { flex: 1; display: grid; gap: 1px; background: #2a2f37; min-height: 0; }
.pane { background: var(--term); padding: 6px 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.ptitle { font-size: 11px; color: var(--term-dim); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #4fc27f; display: inline-block; }
.dot.busy { background: #e2a440; }
.pbody { font-size: 12px; line-height: 1.35; white-space: pre-wrap; word-break: break-all; overflow: hidden; flex: 1; }
.status { background: var(--status); color: #fff; font-size: 12px; padding: 2px 8px; }
.pic { display: block; image-rendering: auto; border-radius: 4px; margin: 4px 0; max-width: 100%; }
.half { line-height: 1; letter-spacing: 0; font-size: 12px; display: block; margin: 4px 0; }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.steps { margin: 14px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.steps li { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 13px; color: var(--muted); }
.steps li b { color: var(--ink); }
.steps li.on { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>keepane × UnifyTerm：控制模式演示</h1>
  <p class="sub">模拟数据，不连真 server。左：keepane server；中：两者之间传的东西；右：你在 UnifyTerm 里看到的。设计稿：<span class="mono">docs/design/control-mode.md</span></p>

  <div class="bar">
    <div class="seg" role="group" aria-label="方式">
      <button id="m-classic" aria-pressed="false">现在：普通 attach</button>
      <button id="m-control" aria-pressed="true">提议：控制模式</button>
    </div>
    <button class="btn primary" id="play">▶ 自动演示一遍</button>
    <button class="btn" id="b-view">在 %1 运行 ut view</button>
    <button class="btn" id="b-type">在 %2 打字</button>
    <button class="btn" id="b-split">在 UnifyTerm 里分屏</button>
    <button class="btn" id="b-resize">改窗口大小</button>
    <button class="btn" id="b-re">断开再连</button>
    <button class="btn" id="b-reset">重来</button>
  </div>

  <div class="grid">
    <section class="card" aria-label="keepane server">
      <h2>keepane server（保活、会话、agent、群聊）</h2>
      <ul class="tree mono" id="tree"></ul>
      <div class="kv"><span>日志编号 seq</span><span class="mono" id="seq">0</span></div>
      <div class="kv"><span>每个 pane 的终端模型</span><span>vt100，只存字符</span></div>
      <p class="note" id="srv-note"></p>
    </section>

    <section class="card" aria-label="协议">
      <h2 id="wire-title">两者之间</h2>
      <div class="log mono" id="log"></div>
      <div class="legend">
        <span class="k-out">← 输出</span><span class="k-in">→ 输入</span><span class="k-cmd">→ 命令/尺寸</span><span class="k-shape">← 形状</span><span class="k-hs">握手/快照</span>
      </div>
    </section>

    <section class="card" aria-label="UnifyTerm">
      <h2 id="ut-title">UnifyTerm 窗口</h2>
      <div class="screen" id="screen"></div>
      <p class="note" id="ut-note"></p>
    </section>
  </div>

  <ol class="steps" id="steps"></ol>
</main>

<script>
"use strict";
// ---- a picture: drawn once, used crisp (UnifyTerm, kitty) or as half blocks (keepane today)
const W = 96, H = 60;
const src = document.createElement("canvas"); src.width = W; src.height = H;
(() => {
  const g = src.getContext("2d");
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#2b5fb8"); sky.addColorStop(1, "#f2b46b");
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = "#ffe08a"; g.beginPath(); g.arc(70, 22, 9, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#3d6b3a"; g.beginPath(); g.moveTo(0, 46); g.quadraticCurveTo(25, 30, 50, 44); g.quadraticCurveTo(75, 56, 96, 40); g.lineTo(96, 60); g.lineTo(0, 60); g.fill();
  g.fillStyle = "#24452a"; g.beginPath(); g.moveTo(0, 54); g.quadraticCurveTo(40, 44, 96, 55); g.lineTo(96, 60); g.lineTo(0, 60); g.fill();
  g.fillStyle = "#1b1b1b"; g.font = "bold 9px sans-serif"; g.fillText("cat.png", 4, 11);
})();
const crisp = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").drawImage(src, 0, 0); const i = document.createElement("img"); i.src = c.toDataURL(); i.className = "pic"; i.width = 192; i.alt = "cat.png（kitty 图片，UnifyTerm 画）"; return i; };
const halfBlocks = (cols) => {
  const rows = Math.round(cols * H / W / 2);
  const s = document.createElement("canvas"); s.width = cols; s.height = rows * 2;
  const g = s.getContext("2d"); g.drawImage(src, 0, 0, cols, rows * 2);
  const d = g.getImageData(0, 0, cols, rows * 2).data;
  const box = document.createElement("span"); box.className = "half mono"; box.setAttribute("aria-label", "cat.png（半格方块）");
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const t = ((y * 2) * cols + x) * 4, b = ((y * 2 + 1) * cols + x) * 4;
      const c = document.createElement("span"); c.textContent = "▀";
      c.style.color = `rgb(${d[t]},${d[t + 1]},${d[t + 2]})`; c.style.background = `rgb(${d[b]},${d[b + 1]},${d[b + 2]})`;
      box.appendChild(c);
    }
    box.appendChild(document.createElement("br"));
  }
  return box;
};

// ---- the session
const fresh = () => ({
  seq: 41, epoch: 7, connected: false, have: 0,
  tabs: [
    { name: "1:dev", layout: "cols", panes: [
      { id: "%1", title: "shell", lines: ["PS C:\\work> "], pic: false, busy: false },
      { id: "%2", title: "claude", lines: ["✻ Claude Code", "> "], pic: false, busy: false } ] },
    { name: "2:logs", layout: "one", panes: [
      { id: "%3", title: "logs", lines: ["GET /api/build 200 12ms"], pic: false, busy: false } ] } ],
  active: 0, width: 132, missed: 0
});
let S = fresh();
let mode = "control";
let step = -1;

const STEPS = [
  ["连上", "UnifyTerm 起 keepane control，发 Hello"],
  ["快照", "keepane 回 Answer 和每个 pane 的屏幕、形状"],
  ["建标签页", "keepane 的窗口 → 标签页，布局 → 分屏"],
  ["实时输出", "Output：pane 的原始字节，UnifyTerm 自己解析"],
  ["输入", "按键 → Input 字节 → pane"],
  ["图片", "kitty 序列原样到 UnifyTerm，画成真图片"],
  ["分屏", "UnifyTerm 里分屏 → Command → Shape 回来"],
  ["尺寸", "UnifyTerm 改大小 → Resize，keepane 照办"],
  ["断开再连", "带上最后的编号，只补后来的"]
];

const $ = (id) => document.getElementById(id);
const log = (dir, kind, text) => {
  if (mode !== "control") return;
  const box = $("log");
  box.querySelector(".empty")?.remove();
  const f = document.createElement("div"); f.className = "frame";
  const cls = { out: "k-out", in: "k-in", cmd: "k-cmd", shape: "k-shape", hs: "k-hs" }[kind];
  f.innerHTML = `<span class="dir ${cls}">${dir}</span><span class="${cls}"></span><span></span>`;
  f.children[1].textContent = text.split("|")[0];
  f.children[2].textContent = text.split("|")[1] || "";
  box.appendChild(f); box.scrollTop = box.scrollHeight;
};
const bump = () => { S.seq++; if (S.connected) S.have = S.seq; else S.missed++; };

function renderSteps() {
  $("steps").innerHTML = "";
  STEPS.forEach(([t, d], i) => {
    const li = document.createElement("li"); if (i === step) li.className = "on";
    li.innerHTML = `<b>${i + 1}. ${t}</b><br>`; li.append(d); $("steps").appendChild(li);
  });
}

function renderTree() {
  const t = $("tree"); t.innerHTML = "";
  const s = document.createElement("li"); s.textContent = "会话 main"; t.appendChild(s);
  S.tabs.forEach((tab) => {
    const w = document.createElement("li"); w.style.paddingLeft = "12px"; w.textContent = "窗口 " + tab.name; t.appendChild(w);
    tab.panes.forEach((p) => {
      const li = document.createElement("li"); li.style.paddingLeft = "26px";
      li.textContent = `${p.id} ${p.title}`;
      const c = document.createElement("span"); c.className = "chip"; c.textContent = p.title === "claude" ? "ai" : "normal"; li.appendChild(c);
      t.appendChild(li);
    });
  });
  $("seq").textContent = S.seq;
  $("srv-note").textContent = mode === "control"
    ? (S.connected ? `控制 client 已连上（有到 #${S.have}）。keepane 不画屏幕，只发日志。` : "没有控制 client 连着：会话照旧跑，日志照记。")
    : "keepane client 把合成好的整屏画给 UnifyTerm。";
}

function paneEl(p, classic) {
  const el = document.createElement("div"); el.className = "pane";
  if (!classic) {
    const tt = document.createElement("div"); tt.className = "ptitle";
    tt.innerHTML = `<span class="dot${p.busy ? " busy" : ""}"></span>`; tt.append(`${p.id} · ${p.title}`);
    el.appendChild(tt);
  }
  const b = document.createElement("div"); b.className = "pbody mono";
  p.lines.forEach((l, i) => {
    if (l === "\u0000pic") { b.appendChild(classic ? halfBlocks(28) : crisp()); return; }
    b.append(l + (i < p.lines.length - 1 ? "\n" : ""));
  });
  el.appendChild(b);
  return el;
}

function renderScreen() {
  const sc = $("screen"); sc.innerHTML = "";
  if (mode === "classic") {
    $("ut-title").textContent = "UnifyTerm 窗口（只是画布）";
    const tab = S.tabs[S.active];
    const panes = document.createElement("div"); panes.className = "panes";
    panes.style.gridTemplateColumns = tab.layout === "one" ? "1fr" : tab.panes.length > 2 ? "1fr 1fr" : "1fr 1fr";
    if (tab.panes.length > 2) panes.style.gridTemplateRows = "1fr 1fr";
    tab.panes.forEach((p, i) => { const e = paneEl(p, true); if (tab.panes.length > 2 && i === 1) e.style.gridRow = "span 2"; panes.appendChild(e); });
    sc.appendChild(panes);
    const st = document.createElement("div"); st.className = "status mono";
    st.textContent = `[main] ${S.tabs.map((t, i) => t.name + (i === S.active ? "*" : "")).join(" ")}        C-b ?`;
    sc.appendChild(st);
    $("ut-note").textContent = "keepane 的终端模型只存字符：kitty 图片在 keepane 里被丢掉，pane 里 ut view 只能画半格方块（0.98.1 起会自动这样画）。滚动、选择、字体都是 keepane 画出来的字符。";
    return;
  }
  $("ut-title").textContent = "UnifyTerm 窗口（原生标签页和分屏，自己渲染）";
  if (!S.connected && S.have === 0) {
    const e = document.createElement("div"); e.className = "empty"; e.style.padding = "40px 20px"; e.textContent = "还没连接：点“自动演示一遍”，或任一按钮。"; sc.appendChild(e);
    $("ut-note").textContent = ""; return;
  }
  const tabs = document.createElement("div"); tabs.className = "tabs";
  S.tabs.forEach((t, i) => { const d = document.createElement("div"); d.className = "tab mono" + (i === S.active ? " on" : ""); d.textContent = t.name.split(":")[1]; d.style.cursor = "pointer"; d.onclick = () => { S.active = i; render(); }; tabs.appendChild(d); });
  sc.appendChild(tabs);
  const tab = S.tabs[S.active];
  const panes = document.createElement("div"); panes.className = "panes";
  if (tab.layout === "one") panes.style.gridTemplateColumns = "1fr";
  else if (tab.panes.length > 2) { panes.style.gridTemplateColumns = "1fr 1fr"; panes.style.gridTemplateRows = "1fr 1fr"; }
  else panes.style.gridTemplateColumns = "1fr 1fr";
  tab.panes.forEach((p, i) => { const e = paneEl(p, false); if (tab.panes.length > 2 && i === 1) e.style.gridRow = "span 2"; panes.appendChild(e); });
  sc.appendChild(panes);
  $("ut-note").textContent = S.connected
    ? `每个 pane 由 UnifyTerm 自己的终端核心渲染：kitty 图片、字体、原生滚动和选择都在。窗口宽 ${S.width} 列。`
    : "已断开：keepane 里的会话照旧在跑（左边的编号还在涨）。";
}

function render() {
  $("m-classic").setAttribute("aria-pressed", mode === "classic");
  $("m-control").setAttribute("aria-pressed", mode === "control");
  $("wire-title").textContent = mode === "control" ? "协议帧（keepane control 的标准输入输出，protobuf；这里写成可读的样子）" : "两者之间（没有协议）";
  if (mode === "classic" && !$("log").querySelector(".classic")) {
    $("log").innerHTML = '<div class="empty classic">keepane client 每次把整屏字符重画给 UnifyTerm：<br><br><span class="mono">ESC[H ESC[2J … 132×40 个格子 …<br>ESC[48;2;60;141;64m [main] 1:dev* …</span><br><br>UnifyTerm 不知道哪里是哪个 pane，也收不到 pane 程序发出的原始字节。</div>';
  }
  renderTree(); renderScreen(); renderSteps();
}

// ---- what happens
const pane = (id) => S.tabs.flatMap((t) => t.panes).find((p) => p.id === id);
function connect() {
  if (S.connected) return;
  step = 0; log("→", "hs", `Hello|since=${S.have || "（无：要快照）"} version=UnifyTerm 0.9`);
  S.connected = true;
  if (S.have === 0) {
    step = 1; log("←", "hs", `Answer|epoch=${S.epoch} version=keepane 0.99`);
    log("←", "hs", `Snapshot|3 个 pane 的屏幕和历史，2 个窗口的布局`);
    step = 2; log("←", "shape", "Shape|1:dev 左右两栏(%1,%2)  2:logs (%3)");
  } else {
    step = 8; log("←", "hs", `Answer|epoch=${S.epoch}：从 #${S.have + 1} 补`);
    for (let i = 0; i < S.missed; i++) log("←", "out", `Output %3|#${S.have + i + 1} 断开期间的输出`);
    S.missed = 0;
  }
  S.have = S.seq;
  render();
}
function out(id, bytes, line) { bump(); log("←", "out", `Output ${id}|#${S.seq} ${bytes}`); if (line !== undefined) pane(id).lines.push(line); }
function utView() {
  connect(); step = 5;
  const p = pane("%1");
  bump(); log("→", "in", "Input %1|\"ut view cat.png\\r\"");
  p.lines[p.lines.length - 1] = "PS C:\\work> ut view cat.png";
  if (mode === "control") out("%1", "ESC_G a=T,f=100,c=24,m=1;iVBORw0K…（kitty，3 段，9 KB）", "\u0000pic");
  else { bump(); p.lines.push("\u0000pic"); }
  p.lines.push("PS C:\\work> ");
  render();
}
function type() {
  connect(); step = 4;
  const p = pane("%2"); p.busy = true;
  bump(); log("→", "in", "Input %2|\"fix the failing test\\r\"");
  p.lines[p.lines.length - 1] = "> fix the failing test";
  out("%2", "ESC[38;2;…m⏺ Reading tests/e2e.rs …", "⏺ Reading tests/e2e.rs …");
  render();
  setTimeout(() => { out("%2", "⏺ Fixed: a stale expectation", "⏺ Fixed: a stale expectation"); pane("%2").lines.push("> "); p.busy = false; render(); }, 900);
}
function split() {
  connect(); step = 6;
  const tab = S.tabs[0];
  if (tab.panes.length > 2) { render(); return; }
  log("→", "cmd", "Command|split-window -v -t %1");
  bump(); tab.panes.splice(2, 0, { id: "%4", title: "shell", lines: ["PS C:\\work> "], pic: false, busy: false });
  log("←", "shape", "Shape|1:dev 左栏上下(%1,%4)  右栏 %2");
  S.active = 0; render();
}
function resize() {
  connect(); step = 7;
  S.width = S.width === 132 ? 168 : 132;
  log("→", "cmd", `Resize|窗口 1:dev → ${S.width}×40（各 pane 按布局分）`);
  bump(); log("←", "shape", "Shape|%1 83×19  %4 83×20  %2 84×40");
  render();
}
function reconnect() {
  if (!S.connected) { connect(); return; }
  step = 8; S.connected = false;
  log("·", "hs", `断开|UnifyTerm 关掉子进程；有到 #${S.have}`);
  render();
  let n = 0;
  const tick = setInterval(() => { bump(); pane("%3").lines.push(`GET /api/build 200 ${10 + n}ms`); n++; render(); if (n === 3) { clearInterval(tick); setTimeout(connect, 700); } }, 450);
}
function reset() { S = fresh(); step = -1; $("log").innerHTML = '<div class="empty">还没有帧。</div>'; render(); }

async function play() {
  reset(); if (mode !== "control") { mode = "control"; reset(); }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  connect(); await wait(1100);
  step = 3; out("%3", "GET /api/build 200 9ms\\r\\n", "GET /api/build 200 9ms"); render(); await wait(900);
  type(); await wait(1800);
  utView(); await wait(1600);
  split(); await wait(1300);
  resize(); await wait(1300);
  reconnect();
}

$("m-classic").onclick = () => { mode = "classic"; $("log").innerHTML = ""; render(); };
$("m-control").onclick = () => { mode = "control"; $("log").innerHTML = '<div class="empty">还没有帧。</div>'; render(); };
$("play").onclick = play;
$("b-view").onclick = utView;
$("b-type").onclick = type;
