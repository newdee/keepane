name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        # The suite spawns shell panes (cmd.exe/pwsh through ConPTY on Windows,
        # sh/bash through a pty elsewhere); keep autosave out of the runner profile.
        env:
          KEEPANE_SESSIONS_DIR: ${{ runner.temp }}/keepane-sessions
        run: cargo test --all-targets
