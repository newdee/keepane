name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older run; every push to master
# runs in a group of its own, so no commit there goes untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    # The page `keepane web` serves is built from web/ into web/dist, which is
    # committed (cargo builds without Node). Built again here, it must come
    # out the same, byte for byte.
    name: web page (types, build = committed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: the committed page is what the source builds
        run: git diff --exit-code --stat -- web/dist

  lint:
    # Beside the tests, not before them: the wait is the longer of the two.
    # rustfmt reads the same on every system, so once, on Linux; clippy
    # sees each system's own code (cfg(windows), cfg(unix)), so on each.
    name: fmt, clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the console host shipped beside keepane.exe (Windows)
        # The panes' console host the release ships (third-party/conpty):
        # the tests run on it, kitty's pictures need it.
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File tools/fetch-conpty.ps1
      - name: test
        # The suite spawns shell panes (cmd.exe/pwsh through ConPTY on Windows,
        # sh/bash through a pty elsewhere); keep autosave out of the runner profile.
        # The e2e tests mostly wait on those shells and servers, not on the
        # CPU, so more threads than libtest's one per core: 12 on Linux and
        # macOS (110 s -> 52 s for the e2e suite on 4 Linux cores); 6 on
        # Windows, where at 12 two e2e tests timed out under the load of the
        # 4-core runner (run 46118911546).
        env:
          KEEPANE_SESSIONS_DIR: ${{ runner.temp }}/keepane-sessions
          RUST_TEST_THREADS: ${{ runner.os == 'Windows' && '6' || '12' }}
        run: cargo test --all-targets
