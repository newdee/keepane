name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    # The page `keepane web` serves is built from web/ into web/dist, which is
    # committed (cargo builds without Node). Built again here, it must come
    # out the same, byte for byte.
    name: web page (types, build = committed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: the committed page is what the source builds
        run: git diff --exit-code --stat -- web/dist

  test:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        # The suite spawns shell panes (cmd.exe/pwsh through ConPTY on Windows,
        # sh/bash through a pty elsewhere); keep autosave out of the runner profile.
        env:
          KEEPANE_SESSIONS_DIR: ${{ runner.temp }}/keepane-sessions
        run: cargo test --all-targets
