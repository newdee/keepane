:root {
  --term-font: "Maple Mono NF CN", "Maple Mono", "JetBrains Mono", "Cascadia Code", ui-monospace, Menlo, Consolas,
    monospace;
  --vh: 100dvh;
}
html, body, #root {
  height: var(--vh);
}
body {
  margin: 0;
  overflow: hidden;
  background: var(--background);
  color: var(--foreground);
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "cv11", "ss01";
}
button, textarea, input {
  touch-action: manipulation;
}
.font-term {
  font-family: var(--term-font);
}
.term {
  margin: 0;
  white-space: pre;
  line-height: 1.25;
  font-family: var(--term-font);
  color: var(--term-fg);
}
.term.wrap {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.term .stamp {
  color: var(--term-fg);
  @supports (color: color-mix(in lab, red, red)) {
    color: color-mix(in oklab, var(--term-fg) 45%, transparent);
  }
  cursor: pointer;
}
.term .stamp.fail {
  color: var(--danger);
}
.thin-scroll {
  scrollbar-width: thin;
  scrollbar-color: var(--foreground) transparent;
  @supports (color: color-mix(in lab, red, red)) {
    scrollbar-color: color-mix(in oklab, var(--foreground) 18%, transparent) transparent;
  }
}
.no-scrollbar {
  scrollbar-width: none;
}
.no-scrollbar::-webkit-scrollbar {
  display: none;
}
@keyframes drop-in {
  from {
    opacity: 0;
    transform: translateY(-8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.drop-in {
  animation: drop-in 0.22s ease-out;
}
